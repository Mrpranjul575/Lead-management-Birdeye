const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

function AppProvider({ children }) {
  const [theme, setTheme] = useState('dark');
  const [leads, setLeads] = useState(MOCK_LEADS);
  const [selected, setSelected] = useState(new Set());
  const [activeLead, setActiveLead] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [view, setViewRaw] = useState('workqueue');

  useEffect(() => { document.documentElement.className = theme; }, [theme]);
  const toggleTheme = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), []);
  const toggleSidebar = useCallback(() => setSidebarOpen(v => !v), []);
  const setView = useCallback((v) => { setActiveLead(null); setViewRaw(v); }, []);
  const openLead = useCallback((lead) => setActiveLead(lead), []);
  const closeLead = useCallback(() => setActiveLead(null), []);
  const toggleSelect = useCallback((id) => setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }), []);
  const selectAll = useCallback((ids) => setSelected(new Set(ids)), []);
  const clearSelect = useCallback(() => setSelected(new Set()), []);
  const bulkUpdateStage = useCallback((stage) => {
    setLeads(prev => prev.map(l => selected.has(l.id) ? { ...l, stage } : l));
    setSelected(new Set());
  }, [selected]);
  const updateLead = useCallback((id, patch) => {
    setLeads(prev => prev.map(l => l.id === id ? { ...l, ...patch } : l));
    setActiveLead(prev => prev?.id === id ? { ...prev, ...patch } : prev);
  }, []);

  return (
    <AppCtx.Provider value={{ theme, toggleTheme, sidebarOpen, toggleSidebar, view, setView, leads, selected, toggleSelect, selectAll, clearSelect, bulkUpdateStage, activeLead, openLead, closeLead, updateLead }}>
      {children}
    </AppCtx.Provider>
  );
}

function Ico({ name, size = 16, className = '', style = {} }) {
  const paths = ICONS[name];
  if (!paths) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`shrink-0 ${className}`} style={style}>

  );

function ScoreRing({ score, size = 36 }) {
  const color = score >= 80 ? '#10b981' : score >= 65 ? '#f59e0b' : '#ef4444';
  const r = size / 2 - 4, circ = 2 * Math.PI * r, cx = size / 2;
  return (
    <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{position:'absolute',inset:0}}>
        <circle cx={cx} cy={cx} r={r} fill="none" stroke="var(--b1)" strokeWidth="2.5"/>
        <circle cx={cx} cy={cx} r={r} fill="none" stroke={color} strokeWidth="2.5"
          strokeDasharray={`${score/100*circ} ${circ}`} strokeLinecap="round"
          transform={`rotate(-90 ${cx} ${cx})`}/>
      </svg>
      <span style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:size>40?13:10,fontWeight:700,color,fontFamily:'JetBrains Mono,monospace'}}>{score}</span>
    </div>
  );
}

            <>
              <button onClick={toggleTheme} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,padding:'3px 8px',borderRadius:5,border:'1px solid var(--b1)',background:'transparent',color:'var(--t2)',cursor:'pointer'}}>

// WORK QUEUE — Main View
// ═══════════════════════════════════════════════
function WorkQueue() {
  const { leads, openLead, selected, toggleSelect, selectAll, clearSelect, bulkUpdateStage } = useApp();
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');

  const filtered = useMemo(() => {
    let r = [...leads];
    if (search) { const q = search.toLowerCase(); r = r.filter(l => l.business.toLowerCase().includes(q) || l.email.toLowerCase().includes(q) || l.contact.toLowerCase().includes(q)); }
    if (filter === 'hot') r = r.filter(l => l.stage === 'Hot');
    else if (filter === 'followup') r = r.filter(l => l.stage === 'Follow Up');
    else if (filter === 'demo') r = r.filter(l => l.stage === 'Demo Booked');
    return r.sort((a, b) => b.aiScore - a.aiScore);
  }, [leads, filter, search]);

  const allIds = filtered.map(l => l.id);
  const allSel = allIds.length > 0 && allIds.every(id => selected.has(id));

  const statCards = [
    {label:'Hot Leads',icon:'flame',color:'#ef4444',bg:'rgba(239,68,68,0.12)',count:leads.filter(l=>l.stage==='Hot').length},
    {label:'Follow Ups',icon:'refresh',color:'#f59e0b',bg:'rgba(245,158,11,0.12)',count:leads.filter(l=>l.stage==='Follow Up').length},
    {label:'Demo Booked',icon:'calendar',color:'#7c5ce8',bg:'rgba(91,63,200,0.15)',count:leads.filter(l=>l.stage==='Demo Booked').length},
    {label:'Re-engage',icon:'radar',color:'#38bdf8',bg:'rgba(56,189,248,0.12)',count:leads.filter(l=>l.stage==='Re-engage').length},
    {label:'New',icon:'users',color:'#3b82f6',bg:'rgba(59,130,246,0.12)',count:leads.filter(l=>l.stage==='New').length},
    {label:'Converted',icon:'checkCircle',color:'#10b981',bg:'rgba(16,185,129,0.12)',count:leads.filter(l=>l.stage==='Converted').length},
  ];

  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:16}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between'}}>
        <div>
          <h1 style={{fontSize:20,fontWeight:700,color:'var(--t1)',margin:0}}>Work Queue</h1>
          <p style={{fontSize:12,color:'var(--t2)',marginTop:3}}>Your action center — sorted by AI score · {leads.length} leads</p>
        </div>
        <button className="ai-glow" style={{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',borderRadius:8,border:'none',cursor:'pointer',background:'var(--p)',color:'#fff',fontSize:12,fontWeight:600,boxShadow:'0 3px 12px rgba(91,63,200,0.35)'}}>
          <Ico name="sparkles" size={13}/>AI Copilot
        </button>
      </div>

      {/* Stat Cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:10}}>
        {statCards.map(c => (
          <div key={c.label} style={{background:'var(--s1)',border:'1px solid var(--b1)',borderRadius:10,padding:'12px 14px',cursor:'pointer',transition:'border-color 0.15s'}}
            onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(91,63,200,0.5)'}
            onMouseLeave={e=>e.currentTarget.style.borderColor='var(--b1)'}>
            <div style={{width:28,height:28,borderRadius:7,background:c.bg,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:8}}><Ico name={c.icon} size={14} style={{color:c.color}}/></div>
            <div style={{fontSize:24,fontWeight:700,color:'var(--t1)',lineHeight:1,fontFamily:'JetBrains Mono,monospace'}}>{c.count}</div>
            <div style={{fontSize:11,fontWeight:600,color:c.color,marginTop:5}}>{c.label}</div>
          </div>
        ))}
      </div>

      {/* Bulk Action Bar */}
      {selected.size > 0 && (
        <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 14px',borderRadius:9,background:'var(--p-chip)',border:'1px solid rgba(91,63,200,0.3)'}}>
          <span style={{fontSize:12,fontWeight:600,color:'var(--p-glow)'}}>{selected.size} selected</span>
          {['Hot','Follow Up','Demo Booked','Nurturing','Lost'].map(s => (
            <button key={s} onClick={()=>bulkUpdateStage(s)} style={{fontSize:10,padding:'3px 10px',borderRadius:99,border:'none',background:'rgba(91,63,200,0.2)',color:'var(--p-glow)',cursor:'pointer',fontFamily:'inherit',fontWeight:500}}>→ {s}</button>
          ))}
          <button onClick={clearSelect} style={{marginLeft:'auto',fontSize:11,color:'var(--t2)',background:'none',border:'none',cursor:'pointer',fontFamily:'inherit'}}>Clear</button>
        </div>
      )}

      {/* Table Container */}
      <div style={{background:'var(--s1)',border:'1px solid var(--b1)',borderRadius:12,overflow:'hidden'}}>
        {/* Filter Tabs + Search */}
        <div style={{display:'flex',alignItems:'center',padding:'8px 12px',borderBottom:'1px solid var(--b1)',gap:8}}>
          <div style={{display:'flex',gap:2}}>
            {[{id:'all',label:'All',count:leads.length},{id:'hot',label:'Hot',count:leads.filter(l=>l.stage==='Hot').length},{id:'followup',label:'Follow Up',count:leads.filter(l=>l.stage==='Follow Up').length},{id:'demo',label:'Demo',count:leads.filter(l=>l.stage==='Demo Booked').length}].map(t => (
              <button key={t.id} onClick={()=>setFilter(t.id)} style={{display:'flex',alignItems:'center',gap:4,padding:'5px 10px',borderRadius:7,border:'none',cursor:'pointer',background:filter===t.id?'var(--p)':'transparent',color:filter===t.id?'#fff':'var(--t2)',fontSize:11,fontWeight:filter===t.id?600:400,fontFamily:'inherit',transition:'all 0.12s'}}>
                {t.label}<span style={{fontSize:10,opacity:.65}}>{t.count}</span>
              </button>
            ))}
          </div>
          <div style={{flex:1}}/>
          <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 10px',borderRadius:7,border:'1px solid var(--b1)',background:'var(--s2)',maxWidth:220}}>
            <Ico name="search" size={12} style={{color:'var(--t2)'}}/>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search leads…" style={{flex:1,background:'transparent',border:'none',outline:'none',fontSize:11,color:'var(--t1)',fontFamily:'inherit'}}/>
            {search && <button onClick={()=>setSearch('')} style={{border:'none',background:'transparent',cursor:'pointer',color:'var(--t2)',display:'flex',padding:0}}><Ico name="x" size={11}/></button>}
          </div>
        </div>

        {/* Table Header */}
        <div style={{display:'grid',gridTemplateColumns:'28px minmax(0,1.8fr) 110px 52px 72px 80px 80px minmax(0,1fr) 90px 100px 28px',gap:8,padding:'7px 14px',borderBottom:'1px solid var(--b1)',background:'rgba(0,0,0,0.2)',alignItems:'center'}}>
          <input type="checkbox" checked={allSel} onChange={e=>e.target.checked?selectAll(allIds):clearSelect()} style={{width:13,height:13,accentColor:'var(--p)',cursor:'pointer'}}/>
          {['Business','Intent','Score','Reviews','AI Vis.','Gap','Next Action','Last Touch','Status',''].map(h => (
            <div key={h} style={{fontSize:10,fontWeight:600,color:'var(--t2)',textTransform:'uppercase',letterSpacing:'0.04em'}}>{h}</div>
          ))}
        </div>

        {/* Table Rows */}
        {filtered.length === 0 ? (
          <div style={{textAlign:'center',padding:'48px 24px',color:'var(--t2)'}}>
            <div style={{fontSize:32,marginBottom:12}}>🔍</div>
            <div style={{fontSize:14,fontWeight:600,color:'var(--t1)',marginBottom:6}}>No leads match filters</div>
            <div style={{fontSize:12}}>Try adjusting the search or filter above.</div>
          </div>
        ) : filtered.map(lead => {
          const sel = selected.has(lead.id);
          const visC = (lead.aiVisibility||0)<15?'#ef4444':(lead.aiVisibility||0)<25?'#f59e0b':'#10b981';
          const gapC = lead.compGap==='High'?'#ef4444':lead.compGap==='Medium'?'#f59e0b':'#10b981';
          return (
            <div key={lead.id} onClick={()=>openLead(lead)}
              style={{display:'grid',gridTemplateColumns:'28px minmax(0,1.8fr) 110px 52px 72px 80px 80px minmax(0,1fr) 90px 100px 28px',gap:8,padding:'9px 14px',borderBottom:'1px solid rgba(48,54,61,0.4)',background:sel?'rgba(91,63,200,0.07)':'transparent',alignItems:'center',cursor:'pointer',transition:'background 0.1s'}}
              onMouseEnter={e=>{if(!sel)e.currentTarget.style.background='rgba(255,255,255,0.025)';}}
              onMouseLeave={e=>{if(!sel)e.currentTarget.style.background='transparent';}}>
              <div onClick={e=>{e.stopPropagation();toggleSelect(lead.id);}}>
                <input type="checkbox" checked={sel} onChange={()=>{}} style={{width:13,height:13,accentColor:'var(--p)',cursor:'pointer'}}/>
              </div>
              <div style={{minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600,color:'var(--t1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lead.business}</div>
                <div style={{fontSize:10,color:'var(--t2)',fontFamily:'JetBrains Mono,monospace',marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lead.email}</div>
              </div>
              <IntentBadge intent={lead.intent}/>
              <ScoreRing score={lead.aiScore} size={34}/>
              <div>
                <div style={{fontSize:12,fontWeight:700,color:'var(--t1)'}}>{lead.reviews}</div>
                <div style={{fontSize:10,color:'var(--t2)'}}>★ {lead.rating}</div>
              </div>
              <div style={{fontSize:11,fontWeight:600,color:visC}}>↓ {lead.aiVisibility||0}%</div>
              <div style={{fontSize:11,fontWeight:600,color:gapC}}>{lead.compGap}</div>
              <div style={{fontSize:11,color:'var(--t1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lead.nextAction}</div>
              <div style={{fontSize:10,color:'var(--t2)',display:'flex',alignItems:'center',gap:3}}><Ico name="clock" size={9}/> {lead.lastTouch}</div>
              <StageBadge stage={lead.stage}/>
              <Ico name="chevRight" size={13} style={{color:'var(--t2)'}}/>
            </div>
          );
        })}

        {/* Footer */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 14px',borderTop:'1px solid var(--b1)',background:'rgba(0,0,0,0.15)'}}>
          <span style={{fontSize:11,color:'var(--t2)'}}>{filtered.length} leads</span>
          <span style={{fontSize:10,color:'var(--t3)'}}>Sorted by AI Score ↓</span>
        </div>
      </div>
    </div>
  );
}

              <div style={{fontSize:12,fontWeight:600,color:'var(--p-glow)'}}>{lead.intent === 'AI Visibility' ? 'Search AI + Listings AI' : lead.intent === 'Review Growth' ? 'Reviews AI' : lead.intent === 'Listings' ? 'Listings AI' : lead.intent === 'Local SEO' ? 'Listings AI + Search AI' : 'Competitors AI + Insights AI'}</div>
            </div>
            <div style={{padding:'10px 12px',background:'rgba(16,185,129,0.06)',borderRadius:8,border:'1px solid rgba(16,185,129,0.15)'}}>
              <div style={{fontSize:10,color:'var(--t2)',marginBottom:3}}>Industry Proof</div>
              <div style={{fontSize:12,fontWeight:600,color:'#10b981'}}>{lead.industry === 'Dental' ? '112% more reviews, 927% search views' : lead.industry === 'Med Spa' ? '80% more reviews, 540% search views' : '128% more reviews, 500%+ search views'}</div>
            </div>
          </div>
        </div>

        {/* Right - Quick Actions */}
        <div style={{background:'var(--s1)',border:'1px solid var(--b1)',borderRadius:12,padding:16}}>
          <div style={{fontSize:10,fontWeight:700,color:'var(--t2)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Quick Actions</div>
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {[['sparkles','Generate Email','var(--p-glow)'],['phone','Log Call','#10b981'],['calendar','Schedule Follow Up','#f59e0b'],['brain','AI Analysis','#3b82f6']].map(([icon, label, color]) => (
              <button key={label} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:7,border:'1px solid var(--b1)',background:'transparent',cursor:'pointer',color:'var(--t1)',fontSize:11,fontFamily:'inherit',transition:'all 0.12s',textAlign:'left'}}>
                <Ico name={icon} size={12} style={{color}}/>{label}
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════
// APP SHELL & RENDER
// ═══════════════════════════════════════════════
function AppShell() {
  const { view, activeLead, sidebarOpen, theme } = useApp();
  const dark = theme === 'dark';
  const sw = sidebarOpen ? 240 : 56;

  return (
    <div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--t1)',fontFamily:'Inter,system-ui,sans-serif'}}>
      <Sidebar/>
      <TopBar sw={sw}/>
      <main style={{marginLeft:sw,paddingTop:56,transition:'margin-left 0.2s ease'}}>
        <div style={{padding:'24px 22px',maxWidth:1260,margin:'0 auto'}}>
          {activeLead ? <LeadPage/> : <WorkQueue/>}
        </div>
      </main>
    </div>
  );
}

function App() {
  return <AppProvider><AppShell/></AppProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App/></React.StrictMode>);
</script>
</body>
</html>
