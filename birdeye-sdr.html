function Pipeline(){const{leads,updateLead,openLead}=useApp();const{dark,T1,T2,B1}=useTheme();const[over,setOver]=useState(null);const cols=STAGES.slice(0,7);return(<div className="fade-up" style={{display:'flex',flexDirection:'column',gap:14}}><div><h1 style={{fontSize:20,fontWeight:700,color:T1,margin:0}}>Pipeline</h1><p style={{fontSize:12,color:T2,marginTop:3}}>Drag leads between stages</p></div><div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8}}>{cols.map(stage=>{const ss=STAGE_STYLE[stage]||STAGE_STYLE['New'];const items=leads.filter(l=>l.stage===stage);const isOver=over===stage;return(<div key={stage} onDragOver={e=>{e.preventDefault();setOver(stage);}} onDragLeave={()=>setOver(null)} onDrop={e=>{e.preventDefault();const id=parseInt(e.dataTransfer.getData('lid'));if(id)updateLead(id,{stage});setOver(null);}} style={{flex:'0 0 200px',display:'flex',flexDirection:'column',background:isOver?ss.bg:'var(--s2)',border:`1px solid ${isOver?ss.color:B1}`,borderRadius:12,overflow:'hidden',transition:'all 0.15s',minHeight:400}}><div style={{padding:'10px 12px',borderBottom:`1px solid ${B1}`,background:dark?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.03)',flexShrink:0}}><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:8,height:8,borderRadius:'50%',background:ss.color}}/><span style={{fontSize:11,fontWeight:600,color:T1}}>{stage}</span><span style={{fontSize:10,fontWeight:700,color:ss.color,background:`${ss.color}20`,padding:'0 5px',borderRadius:99,fontFamily:'JetBrains Mono,monospace'}}>{items.length}</span></div></div><div style={{flex:1,overflowY:'auto',padding:'8px 6px',display:'flex',flexDirection:'column',gap:6}}>{items.length===0?<div style={{padding:'16px 8px',textAlign:'center',color:'rgba(72,79,88,0.5)',fontSize:11,border:'1.5px dashed var(--b1)',borderRadius:8}}>Drop here</div>:items.map(lead=>{const is=INTENT_STYLE[lead.intent]||INTENT_STYLE['AI Visibility'];return(<div key={lead.id} draggable onDragStart={e=>e.dataTransfer.setData('lid',lead.id)} onClick={()=>openLead(lead)} style={{background:dark?'#161b22':'#fff',border:`1px solid ${B1}`,borderRadius:9,padding:'10px',cursor:'grab',transition:'border-color 0.15s'}} onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(91,63,200,0.4)'} onMouseLeave={e=>e.currentTarget.style.borderColor=B1}><div style={{fontSize:11,fontWeight:600,color:T1,marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lead.business}</div><span style={{fontSize:9,fontWeight:500,padding:'1px 6px',borderRadius:99,display:'inline-block',marginBottom:5,background:is.bg,color:is.color}}>{lead.intent}</span><div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><span style={{fontSize:9,color:T2}}>{lead.lastTouch}</span><span style={{fontSize:10,fontWeight:700,color:lead.aiScore>=80?'#10b981':lead.aiScore>=65?'#f59e0b':'#ef4444',fontFamily:'JetBrains Mono,monospace'}}>{lead.aiScore}</span></div></div>);})}</div></div>);})}</div></div>);}

function Reports(){const{leads}=useApp();const{T1,T2,B1,S1,S3}=useTheme();const acts=leads.flatMap(l=>l.activities||[]);const emails=acts.filter(a=>a.type==='Email').length;const calls=acts.filter(a=>a.type==='Call').length;const sms=acts.filter(a=>a.type==='SMS').length;const replies=acts.filter(a=>['Replied','Positive','Connected'].includes(a.outcome)).length;const rr=emails>0?parseFloat((replies/emails*100).toFixed(1)):0;

ng:'10px 12px',background:S1,border:`1px solid ${B1}`,borderRadius:9}}><div><div style={{fontSize:9,color:T2,marginBottom:2}}>DAY</div><input type="number" min={1} value={step.day} onChange={e=>setForm(f=>({...f,steps:f.steps.map((s,j)=>j===i?{...s,day:+e.target.value}:s)}))} style={{width:'100%',padding:'5px 6px',borderRadius:6,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:12,fontFamily:'inherit',outline:'none',textAlign:'center'}}/></div><div><div style={{fontSize:9,color:T2,marginBottom:2}}>CHANNEL</div><select value={step.channel} onChange={e=>setForm(f=>({...f,steps:f.steps.map((s,j)=>j===i?{...s,channel:e.target.value}:s)}))} style={{width:'100%',padding:'5px 6px',borderRadius:6,border:`1px solid ${cc}40`,background:`${cc}12`,color:cc,fontSize:11,fontFamily:'inherit',outline:'none',cursor:'pointer'}}>{CHANNELS.map(c=><option key={c}>{c}</option>)}</select></div><div><div style={{fontSize:9,color:T2,marginBottom:2}}>ANGLE</div><input value={step.angle||''} onChange={e=>setForm(f=>({...f,steps:f.steps.map((s,j)=>j===i?{...s,angle:e.target.value}:s)}))} placeholder="Message angle…" style={{width:'100%',padding:'5px 8px',borderRadius:6,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:12,fontFamily:'inherit',outline:'none'}}/></div><button onClick={()=>setForm(f=>({...f,steps:f.steps.filter((_,j)=>j!==i)}))} style={{padding:4,border:'none',background:'transparent',cursor:'pointer',color:T2}}><Ico name="trash" size={12}/></button></div>);})}</div><div style={{display:'flex',gap:8,justifyContent:'flex-end'}}><Btn variant="ghost" onClick={()=>setShowForm(false)}>Cancel</Btn><Btn onClick={save}><Ico name="save" size={12}/>Save</Btn></div></div>);

// ═══ AI MEMORY ═══
function AIMemory(){const{leads,addMemory,removeMemory}=useApp();const{T1,T2,B1,S1,S3,BG}=useTheme();const[search,setSearch]=useState('');const[tagF,setTagF]=useState('All');const[adding,setAdding]=useState(false);const[text,setText]=useState('');const[tag,setTag]=useState('Context');const[leadId,setLeadId]=useState('');const TAGS=['Context','Pain Point','Objection','Competitor','Win Signal','Decision Maker','Budget','Timeline'];const TC={'Context':'#60a5fa','Pain Point':'#f472b6','Objection':'#f87171','Competitor':'#fcd34d','Win Signal':'#34d399','Decision Maker':'#7c5ce8','Budget':'#fcd34d','Timeline':'#38bdf8'};
const all=useMemo(()=>leads.flatMap(l=>(l.memory||[]).map(m=>({...m,leadId:l.id,biz:l.business}))).sort((a,b)=>(b.id||0)-(a.id||0)),[leads]);const filtered=useMemo(()=>{let r=all;if(search){const q=search.toLowerCase();r=r.filter(m=>m.text?.toLowerCase().includes(q)||m.biz?.toLowerCase().includes(q));}if(tagF!=='All')r=r.filter(m=>m.tag===tagF);return r;},[all,search,tagF]);const grouped=filtered.reduce((g,m)=>{(g[m.biz]||(g[m.biz]=[])).push(m);return g;},{});
const save=()=>{if(!text.trim()||!leadId)return;addMemory(parseInt(leadId),{text:text.trim(),tag,date:'Today'});setText('');setAdding(false);setLeadId('');};

function NewLead(){const{addLead,setView}=useApp();const{T1,T2,B1,S1,BG}=useTheme();const[raw,setRaw]=useState('SmileCraft Dental\nsarah@smilecraftdental.com\n(512) 555-0198\nAustin, TX');const[parsed,setParsed]=useState(null);const[fields,setFields]=useState({});const[saved,setSaved]=useState(false);
const parse=()=>{const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);const r={};lines.forEach(line=>{const em=line.match(/[\w.+\-]+@[\w\-]+\.\w+/);if(em&&!r.email)r.email=em[0];const ph=line.match(/\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}/);if(ph&&!r.phone)r.phone=ph[0];if(/,\s*[A-Z]{2}\b/.test(line)&&!r.city)r.city=line;if(!r.business&&/^[A-Z]/.test(line)&&!line.includes('@')&&!line.match(/^https?:\/\//)&&line.length<80)r.business=line;for(const[rx,ind]of[[/dental/i,'Dental'],[/spa|med.?spa/i,'Med Spa'],[/chiro/i,'Chiropractic'],[/wellness/i,'Wellness'],[/fitness/i,'Fitness'],[/derm|skin/i,'Dermatology']]){if(rx.test(line)&&!r.industry){r.industry=ind;break;}}});r.intent=r.intent||'AI Visibility';r.industry=r.industry||'Healthcare';setParsed(r);setFields({...r,stage:'New'});};
const saveLead=()=>{addLead({...fields,reviews:0,rating:0,aiVisibility:0,compGap:'Medium',nextAction:'Initial Outreach',lastTouch:'Never',stage:fields.stage||'New',cadenceDay:0,cadenceTotal:7,aeNotes:''});setSaved(true);setTimeout(()=>setView('workqueue'),1200);};
const inp={width:'100%',padding:'5px 8px',borderRadius:7,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:11,fontFamily:'inherit',outline:'none'};
return(<div className="fade-up" style={{maxWidth:800}}><div style={{marginBottom:16}}><h1 style={{fontSize:20,fontWeight:700,color:T1,margin:0}}>New Lead — Smart Parser</h1><p style={{fontSize:12,color:T2,marginTop:3}}>Paste raw data and we extract everything.</p></div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}><div style={{display:'flex',flexDirection:'column',gap:10}}><Card><div style={{fontSize:11,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>Raw Lead Data</div><textarea value={raw} onChange={e=>{setRaw(e.target.value);setParsed(null);}} rows={10} placeholder="Paste data here…" style={{width:'100%',padding:10,borderRadius:8,resize:'vertical',border:`1px solid ${B1}`,outline:'none',background:BG,color:T1,fontSize:11,fontFamily:'JetBrains Mono,monospace',lineHeight:1.7}}/></Card><Btn onClick={parse} disabled={!raw.trim()} size="lg" style={{width:'100%',justifyContent:'center'}}><Ico name="sparkles" size={14}/>Parse</Btn></div><div style={{display:'flex',flexDirection:'column',gap:10}}><Card><div style={{fontSize:11,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Extracted Fields</div>{parsed?<div style={{display:'flex',flexDirection:'column',gap:4}}>{[['business','Business'],['email','Email'],['phone','Phone'],['city','City'],['industry','Industry'],['intent','Intent']].map(([key,label])=><div key={key} style={{display:'grid',gridTemplateColumns:'80px 1fr',gap:6,alignItems:'center',padding:'5px 8px',borderRadius:7,border:`1px solid ${parsed[key]?'rgba(16,185,129,0.3)':B1}`,background:parsed[key]?'rgba(16,185,129,0.04)':'var(--s2)'}}><div style={{fontSize:9,fontWeight:600,color:T2,textTransform:'uppercase'}}>{label}</div><input value={fields[key]||''} onChange={e=>setFields(f=>({...f,[key]:e.target.value}))} style={inp}/></div>)}</div>:<div style={{textAlign:'center',padding:20,color:T2,fontSize:12}}>Click "Parse" to extract fields</div>}</Card>{parsed&&!saved&&<Btn onClick={saveLead} size="lg" style={{width:'100%',justifyContent:'center'}}><Ico name="plus" size={14}/>Save Lead</Btn>}{saved&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px',borderRadius:9,background:'rgba(16,185,129,0.1)',border:'1px solid rgba(16,185,129,0.25)'}}><Ico name="checkCircle" size={14} color="#10b981"/><span style={{fontSize:12,fontWeight:600,color:'#10b981'}}>Saved! Redirecting…</span></div>}</div></div></div>);}

{tab==='ae_notes'&&<div><textarea value={lead.aeNotes||''} onChange={e=>updateLead(lead.id,{aeNotes:e.target.value})} rows={18} placeholder="Paste research: competitor counts, GMB URL, keywords…" style={{width:'100%',padding:14,borderRadius:10,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:12,fontFamily:'JetBrains Mono,monospace',lineHeight:1.8,resize:'vertical',outline:'none'}}/></div>}
{tab==='intelligence'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>{[['painPoints','Pain Points','#f87171'],['competitors','Competitors','#f59e0b'],['objections','Objections','#f472b6'],['buyingSignals','Buying Signals','#34d399']].map(([field,label,color])=>{const items=intel[field]||[];return<div key={field} style={{background:BG,border:`1px solid ${B1}`,borderRadius:10,padding:'12px 14px'}}><div style={{fontSize:10,fontWeight:600,color:T2,textTransform:'uppercase',marginBottom:8}}>{label}</div>{items.length===0?<span style={{fontSize:11,color:'var(--t3)',fontStyle:'italic'}}>None logged</span>:items.map((item,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:7,marginBottom:4}}><div style={{width:5,height:5,borderRadius:'50%',background:color,flexShrink:0}}/><span style={{fontSize:12,color:T1}}>{item}</span></div>)}</div>;})}</div>}
{tab==='timeline'&&<div>{(lead.activities||[]).length===0?<EmptyState icon="🕐" title="No timeline entries" sub="Log calls and emails to build history."/>:(lead.activities||[]).map((act,i)=><div key={act.activityId||i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 14px',background:BG,border:`1px solid ${B1}`,borderRadius:10,marginBottom:8}}><div style={{width:30,height:30,borderRadius:8,background:'rgba(91,63,200,0.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ico name={act.type==='Email'?'mail':act.type==='Call'?'phone':'sparkles'} size={14} color="var(--p-glow)"/></div><div style={{flex:1}}><div style={{fontSize:12,fontWeight:600,color:T1}}>{act.summary}</div>{act.details?.content&&<p style={{fontSize:11,color:T2,lineHeight:1.5,margin:'3px 0 0'}}>{act.details.content}</p>}</div><span style={{fontSize:10,color:T2,flexShrink:0}}>{new Date(act.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div>)}</div>}
{tab==='memory'&&<div style={{display:'flex',flexDirection:'column',gap:10}}>{(lead.memory||[]).length===0?<EmptyState icon="🧠" title="No memory entries" sub="Add context above."/>:(lead.memory||[]).map(m=>{const TC={'Context':'#60a5fa','Pain Point':'#f472b6','Objection':'#f87171','Competitor':'#fcd34d','Win Signal':'#34d399','Decision Maker':'#7c5ce8'};const c=TC[m.tag]||'#60a5fa';return(<div key={m.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 14px',background:BG,border:`1px solid ${B1}`,borderRadius:10}}><Ico name="brain" size={13} color="var(--p-glow)" style={{flexShrink:0,marginTop:2}}/><div style={{flex:1}}><p style={{fontSize:12,color:T1,lineHeight:1.6,margin:0}}>{m.text}</p><div style={{display:'flex',gap:6,marginTop:5}}>{m.tag&&<span style={{fontSize:10,fontWeight:600,padding:'1px 7px',borderRadius:99,background:`${c}18`,color:c}}>{m.tag}</span>}<span style={{fontSize:10,color:T2}}>{m.date}</span></div></div><button onClick={()=>removeMemory(lead.id,m.id)} style={{padding:3,border:'none',background:'transparent',cursor:'pointer',color:T2,opacity:.5}}><Ico name="trash" size={12}/></button></div>);})}</div>}
</div></div>);
}

// ═══ AI COPILOT MODAL ═══
function CopilotModal(){
const{copilotOpen,copilotMode,copilotLead,closeCopilot,activeLead,settings}=useApp();const{dark,T1,T2,B1,S1,BG}=useTheme();const[mode,setMode]=useState(null);const[output,setOutput]=useState('');const[copied,setCopied]=useState(false);
const lead=copilotLead||activeLead||null;
const MODES=[{id:'email',label:'Email',icon:'mail',desc:'3 email variations',color:'#7c5ce8'},{id:'sms',label:'SMS',icon:'phone',desc:'3 SMS messages',color:'#3b82f6'},{id:'voicemail',label:'Voicemail',icon:'mic',desc:'30-sec script',color:'#f59e0b'},{id:'linkedin',label:'LinkedIn',icon:'linkedin',desc:'Connection sequence',color:'#0a66c2'},{id:'situational',label:'Situational',icon:'brain',desc:'Best move now',color:'#ec4899'},{id:'cadence',label:'Cadence',icon:'zap',desc:'7-step sequence',color:'#7c5ce8'},{id:'notes',label:'AE Notes',icon:'fileText',desc:'Auto-generate notes',color:'#38bdf8'},{id:'objections',label:'Objections',icon:'target',desc:'Handle objections',color:'#10b981'}];
useEffect(()=>{if(copilotOpen&&copilotMode){setMode(copilotMode);setOutput('');}else{setMode(null);setOutput('');}},[copilotOpen,copilotMode]);
if(!copilotOpen)return null;
const copyPrompt=()=>{navigator.clipboard.writeText(`Generate ${mode||'email'} for ${lead?.business||'lead'}`);setCopied(true);setTimeout(()=>setCopied(false),2000);};
return(<>
<div onClick={closeCopilot} style={{position:'fixed',inset:0,zIndex:99,background:'rgba(0,0,0,0.6)',backdropFilter:'blur(4px)'}}/>
<div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:580,maxHeight:'88vh',zIndex:100,borderRadius:16,background:S1,border:`1px solid ${B1}`,boxShadow:'0 24px 64px rgba(0,0,0,0.55)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:`1px solid ${B1}`,flexShrink:0}}><div style={{display:'flex',alignItems:'center',gap:10}}><div style={{width:36,height:36,borderRadius:10,background:'var(--p)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(91,63,200,0.4)'}}><Ico name="sparkles" size={17} color="#fff"/></div><div><div style={{fontSize:14,fontWeight:700,color:T1}}>Birdeye AI Copilot</div><div style={{fontSize:11,color:T2,marginTop:1}}>{mode?`${MODES.find(m=>m.id===mode)?.label||mode} — ${lead?lead.business:'No lead'}`:'Select a mode'}</div></div></div><button onClick={closeCopilot} style={{padding:5,border:'none',background:'transparent',cursor:'pointer',color:T2,display:'flex'}}><Ico name="x" size={15}/></button></div>
<div style={{flex:1,overflowY:'auto',padding:'16px 20px'}}>
{!mode?<div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>{MODES.map(m=><button key={m.id} onClick={()=>setMode(m.id)} style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:7,padding:12,borderRadius:10,border:`1px solid ${B1}`,background:dark?'rgba(255,255,255,0.02)':'rgba(0,0,0,0.02)',cursor:'pointer',textAlign:'left',fontFamily:'inherit',transition:'all 0.15s'}}><div style={{width:28,height:28,borderRadius:7,background:`${m.color}20`,display:'flex',alignItems:'center',justifyContent:'center'}}><Ico name={m.icon} size={14} color={m.color}/></div><div><div style={{fontSize:12,fontWeight:600,color:T1}}>{m.label}</div><div style={{fontSize:10,color:T2,marginTop:1}}>{m.desc}</div></div></button>)}</div>:
<div style={{display:'flex',flexDirection:'column',gap:12}}>
{lead&&<div style={{display:'flex',gap:10,padding:'10px 12px',borderRadius:9,background:'var(--p-soft)',border:'1px solid rgba(91,63,200,0.2)'}}><div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,color:'var(--p-glow)',marginBottom:4}}>Lead context loaded:</div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'2px 16px'}}>{[['Intent',lead.intent],['Score',lead.aiScore],['Reviews',lead.reviews],['Stage',lead.stage]].map(([k,v])=><div key={k} style={{display:'flex',gap:4}}><span style={{fontSize:10,color:T2}}>{k}:</span><span style={{fontSize:10,color:T1,fontWeight:500}}>{v}</span></div>)}</div></div></div>}
<div style={{display:'flex',gap:8}}><Btn onClick={copyPrompt}><Ico name="copy" size={12}/>{copied?'Copied!':'Copy Prompt'}</Btn><Btn variant="ghost" onClick={()=>window.open('https://claude.ai','_blank')}><Ico name="externalLink" size={12}/>Open Claude.ai</Btn></div>
<div><div style={{fontSize:11,fontWeight:600,color:T2,marginBottom:5}}>Paste AI response here:</div><textarea value={output} onChange={e=>setOutput(e.target.value)} rows={10} placeholder="Copy prompt → paste in Claude.ai → copy response → paste here…" style={{width:'100%',padding:'10px 12px',borderRadius:9,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:12,fontFamily:'inherit',lineHeight:1.7,resize:'vertical',outline:'none'}}/></div>
</div>}
</div>
<div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 20px',borderTop:`1px solid ${B1}`,flexShrink:0,background:dark?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.02)'}}><button onClick={()=>{if(mode)setMode(null);else closeCopilot();}} style={{padding:'7px 14px',borderRadius:8,border:`1px solid ${B1}`,background:'transparent',color:T2,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>{mode?'← Back':'Cancel'}</button>{output&&<Btn onClick={closeCopilot}><Ico name="save" size={13}/>Done</Btn>}</div>
</div>
</>);
}

// ═══ APP SHELL ═══
const VIEW_MAP={dashboard:Dashboard,workqueue:WorkQueue,leads:MyLeads,hot:HotLeads,followups:FollowUps,demobooked:DemoBooked,reengage:ReEngage,pipeline:Pipeline,reports:Reports,cadences:Cadences,memory:AIMemory,settings:Settings,newlead:NewLead};
function AppShell(){
const{view,activeLead,sidebarOpen}=useApp();const{dark}=useTheme();const sw=sidebarOpen?240:56;const fullWidth=['pipeline','cadences'].includes(view);
useEffect(()=>{document.documentElement.className=dark?'dark':'light';},[dark]);
const ViewComp=VIEW_MAP[view]||Dashboard;
return(<div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--t1)',fontFamily:'Inter,system-ui,sans-serif'}}><Sidebar/><TopBar sw={sw}/><main style={{marginLeft:sw,paddingTop:56,transition:'margin-left 0.2s ease'}}><div style={{padding:fullWidth?'18px 14px':'24px 22px',maxWidth:fullWidth?'100%':1260,margin:'0 auto'}}>{activeLead?<LeadPage/>:<ViewComp/>}</div></main><CopilotModal/></div>);
}
function App(){return<AppProvider><AppShell/></AppProvider>;}
ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App/></React.StrictMode>);
</script>
</body>
</html>
