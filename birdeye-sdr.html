const AppCtx = createContext(null);
const useApp = () => useContext(AppCtx);

function useTheme() {
  const { theme } = useApp();
  const dark = theme === 'dark';
  return {
    dark, theme,
    T1: dark ? '#e6edf3' : '#111827',
    T2: dark ? '#8b949e' : '#6b7280',
    T3: dark ? '#484f58' : '#9ca3af',
    B1: dark ? '#30363d' : '#e5e7eb',
    B2: dark ? '#484f58' : '#d1d5db',
    S1: dark ? '#161b22' : '#ffffff',
    S2: dark ? '#0d1117' : '#f8f9fa',
    S3: dark ? '#21262d' : '#f3f4f5',
    BG: dark ? '#0d1117' : '#f8f9fa',
  };
}

function AppProvider({ children }) {
  const [theme, setTheme] = useState(() => {
    const stored = localStorage.getItem('be_theme');
    return stored || 'dark';
  });
  const [view, setViewRaw] = useState('workqueue');
  const [leads, setLeads] = useState(loadLeads);
  const [cadences, setCadences] = useState(loadCadences);
  const [settings, setSettingsRaw] = useState(loadSettings);
  const [activeLead, setActiveLead] = useState(null);
  const [selected, setSelected] = useState(new Set());
  const [copilot, setCopilot] = useState({ open: false, mode: null, lead: null });
  const [clipSearch, setClipSearch] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);

  useEffect(() => {
    document.documentElement.className = theme;
    localStorage.setItem('be_theme', theme);
  }, [theme]);

  useEffect(() => { saveLeads(leads); }, [leads]);
  useEffect(() => { saveCadences(cadences); }, [cadences]);

  const toggleTheme = useCallback(() => setTheme(t => t === 'dark' ? 'light' : 'dark'), []);
  const toggleSidebar = useCallback(() => setSidebarOpen(v => !v), []);

  const setView = useCallback((v) => { setActiveLead(null); setViewRaw(v); }, []);

  const updateLead = useCallback((id, patch) => {
    setLeads(prev => prev.map(l => l.id === id ? { ...l, ...patch } : l));
    setActiveLead(prev => prev?.id === id ? { ...prev, ...patch } : prev);
  }, []);

  const updateIntelligence = useCallback((id, patch) => {
    setLeads(prev => prev.map(l => l.id === id ? {
      ...l, intelligence: { ...l.intelligence, ...patch, lastUpdated: new Date().toISOString() }
    } : l));
    setActiveLead(prev => prev?.id === id ? {
      ...prev, intelligence: { ...prev.intelligence, ...patch, lastUpdated: new Date().toISOString() }
    } : prev);
  }, []);

  const addLead = useCallback((data) => {
    const newLead = {
      ...data, id: Date.now(),
      activities: data.activities || [],
      memory: data.memory || [],
      touchLog: data.touchLog || [],
      followUps: data.followUps || [],
      files: data.files || [],
      intelligence: data.intelligence || {
        summary:'', painPoints:[], objections:[], competitors:[],
        buyingSignals:[], decisionMakers: data.contact ? [data.contact] : [],
        leadTemperature:'Cold', meetingProbability:20,
        nextBestAction: data.nextAction || '',
        lastConversation:'', lastUpdated: new Date().toISOString(),
      },
    };
    setLeads(prev => [newLead, ...prev]);
    return newLead;
  }, []);

  const addLeads = useCallback((dataArray) => {
    const newLeads = dataArray.map(data => ({
      ...data, id: Date.now() + Math.random(),
      activities: [], memory: [], touchLog: [], followUps: [], files: [],
      intelligence: {
        summary:'', painPoints:[], objections:[], competitors:[],
        buyingSignals:[], decisionMakers: data.contact ? [data.contact] : [],
        leadTemperature:'Cold', meetingProbability:20,
        nextBestAction: data.nextAction || '', lastConversation:'',
        lastUpdated: new Date().toISOString(),
      },
    }));
    setLeads(prev => [...newLeads, ...prev]);
  }, []);

  const addActivity = useCallback((leadId, type, summary, details = {}) => {
    const act = {
      activityId: Date.now() + Math.random(),
      timestamp: new Date().toISOString(),
      type, summary, details,
      outcome: details.outcome || null,
      source: details.source || 'manual',
    };
    setLeads(prev => prev.map(l => l.id === leadId ? { ...l, activities: [act, ...(l.activities||[])] } : l));
    setActiveLead(prev => prev?.id === leadId ? { ...prev, activities: [act, ...(prev.activities||[])] } : prev);
    return act;
  }, []);

  const addMemory = useCallback((leadId, entry) => {
    const mem = { ...entry, id: Date.now() + Math.random() };
    setLeads(prev => prev.map(l => l.id === leadId ? { ...l, memory: [mem, ...(l.memory||[])] } : l));
    setActiveLead(prev => prev?.id === leadId ? { ...prev, memory: [mem, ...(prev.memory||[])] } : prev);
  }, []);

  const removeMemory = useCallback((leadId, memId) => {
    setLeads(prev => prev.map(l => l.id === leadId ? { ...l, memory: (l.memory||[]).filter(m => m.id !== memId) } : l));
    setActiveLead(prev => prev?.id === leadId ? { ...prev, memory: (prev.memory||[]).filter(m => m.id !== memId) } : prev);
  }, []);

  const openLead = useCallback((lead) => { setActiveLead(lead); }, []);
  const closeLead = useCallback(() => setActiveLead(null), []);

  const toggleSelect = useCallback((id) => setSelected(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; }), []);
  const selectAll = useCallback((ids) => setSelected(new Set(ids)), []);
  const clearSelect = useCallback(() => setSelected(new Set()), []);
  const bulkUpdateStage = useCallback((stage) => {
    setLeads(prev => prev.map(l => selected.has(l.id) ? { ...l, stage } : l));
    setSelected(new Set());
  }, [selected]);

  const openCopilot = useCallback((mode, lead = null) => setCopilot({ open: true, mode, lead }), []);
  const closeCopilot = useCallback(() => setCopilot({ open: false, mode: null, lead: null }), []);

  const updateSettings = useCallback((patch) => {
    setSettingsRaw(prev => { const next = { ...prev, ...patch }; saveSettings(next); return next; });
  }, []);

  const saveCadence = useCallback((c) => {
    setCadences(prev => c.id ? prev.map(x => x.id === c.id ? c : x) : [...prev, { ...c, id: Date.now() }]);
  }, []);
  const deleteCadence = useCallback((id) => setCadences(prev => prev.filter(c => c.id !== id)), []);

  const value = {
    theme, toggleTheme, sidebarOpen, toggleSidebar,
    view, setView,
    leads, addLead, addLeads, updateLead, updateIntelligence,
    addActivity, addMemory, removeMemory,
    activeLead, openLead, closeLead,
    selected, toggleSelect, selectAll, clearSelect, bulkUpdateStage,

const SHEET_COLS = {
  Leads: ['id','business','contact','email','phone','website','city','industry',
    'intent','aiScore','reviews','rating','aiVisibility','compGap','stage',
    'nextAction','lastTouch','cadenceDay','cadenceTotal','competitor','keyword',
    'gmbUrl','salesloftUrl','mqlDate','tags','createdAt','updatedAt'],
  Activities: ['activityId','leadId','leadBusiness','timestamp','type','summary','outcome','source'],
  'AI Memory': ['id','leadId','business','text','tag','date'],
};

async function sheetsAPI(method, path, body, token) {
  const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets${path}`, {
    method, headers: { Authorization:`Bearer ${token}`, 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||`Sheets ${res.status}`); }
  return res.json();
}

async function ensureHeaders(sheetId, tab, token) {
  const cols = SHEET_COLS[tab];
  if (!cols) return;
  try {
    const r = await sheetsAPI('GET',`/${sheetId}/values/${encodeURIComponent(tab)}!A1:A1`,null,token);
    if (r.values?.length) return;
    await sheetsAPI('PUT',`/${sheetId}/values/${encodeURIComponent(tab)}!A1?valueInputOption=USER_ENTERED`,{values:[cols]},token);
  } catch {}
}

async function appendRow(sheetId, tab, row, token) {
  await ensureHeaders(sheetId, tab, token);
  await sheetsAPI('POST',`/${sheetId}/values/${encodeURIComponent(tab)}!A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{values:[row]},token);
}

const Sheets = {
  async testConnection({ sheetsId, sheetsToken }) {
    if (!sheetsId||!sheetsToken) return {ok:false,error:'Missing Sheets ID or token'};
    try { await sheetsAPI('GET',`/${sheetsId}?fields=spreadsheetId`,null,sheetsToken); return {ok:true}; }
    catch(e) { return {ok:false,error:e.message}; }
  },
  async pushLead(lead, { sheetsId, sheetsToken }) {
    if (!sheetsId||!sheetsToken) return;
    try {
      const row = SHEET_COLS.Leads.map(k => {
        if (k==='tags') return JSON.stringify(lead.tags||[]);
        if (k==='updatedAt') return new Date().toISOString();
        if (k==='createdAt') return lead.createdAt||new Date().toISOString();
        return String(lead[k]??'');
      });
      await appendRow(sheetsId, 'Leads', row, sheetsToken);
    } catch {}
  },
  async pushActivity(leadId, leadBusiness, act, { sheetsId, sheetsToken }) {
    if (!sheetsId||!sheetsToken) return;
    try {
      await appendRow(sheetsId,'Activities',[
        act.activityId,leadId,leadBusiness,act.timestamp,act.type,
        act.summary,act.outcome||'',act.source||'manual'
      ],sheetsToken);
    } catch {}
  },
  async pushMemory(leadId, business, mem, { sheetsId, sheetsToken }) {
    if (!sheetsId||!sheetsToken) return;
    try {
      await appendRow(sheetsId,'AI Memory',[mem.id,leadId,business,mem.text,mem.tag||'',mem.date||''],sheetsToken);
    } catch {}
  },
};

function buildEmailPrompt(lead) {
  if (!lead) return 'No lead selected.';
  const ctx = buildLeadContext(lead);
  const n = (lead.touchLog||[]).filter(t=>t.type==='Email'||t.channel==='Email').length;
  return `${BIRDEYE_SYSTEM}\n\n${ctx}\n\n═══ TASK: GENERATE 3 EMAIL VARIATIONS ═══\n${
    n===0?`ANGLE: FIRST email. Lead with their specific pain (${lead.intent}). Reference ${lead.competitor||'their competitor'}. DO NOT name Birdeye until sentence 3 minimum.`
    :n===1?`ANGLE: Second touch. No reply. COMPLETELY change angle. Try a data point, question, or case study.`
    :`ANGLE: Touch ${n+1}. Pattern interrupt — be very short (2-3 lines) or use break-up style.`
  }\n\nWrite 3 email variations:\n- Email 1: Data-led (use their review count ${lead.reviews}, visibility ${lead.aiVisibility}%, or competitor gap)\n- Email 2: Story/social proof (similar ${lead.industry||'business'} that succeeded with the proof stat)\n- Email 3: Direct/short (under 60 words total)\n\nEach ends with ONE question as CTA. Sign: Paul | Senior SDR, Birdeye\nLabel: === EMAIL 1 === / === EMAIL 2 === / === EMAIL 3 ===`;

function buildVoicemailPrompt(lead) {

function buildLinkedinPrompt(lead) {

function buildSituationalPrompt(lead) {

function buildCadencePrompt(lead) {
  if (!lead) return 'No lead selected.';
  const ctx = buildLeadContext(lead);
  return `${BIRDEYE_SYSTEM}\n\n${ctx}\n\n═══ TASK: BUILD A 7-STEP OUTREACH CADENCE ═══\nOptimised for intent (${lead.intent}) and stage (${lead.stage}).\n\nFor each step:\n- Day / Channel / Time (AM or PM) / Angle / If-Reply / If-No-Reply\n\nRules:\n- Mix channels (no 3 emails in a row)\n- Day 1-3: Value-led (no hard pitch)\n- Day 4-6: Social proof + soft CTA\n- Day 7: Break-up / last attempt\n\nFormat: STEP X | Day Y | [Channel] | [AM/PM]\nAngle: ...\nIf reply: ...\nIf no reply: ...`;
}

function buildAENotesPrompt(lead) {
  if (!lead) return 'No lead selected.';
  const ctx = buildLeadContext(lead);
  return `${BIRDEYE_SYSTEM}\n\n${ctx}\n\n═══ TASK: GENERATE STRUCTURED AE NOTES ═══\nSummarise everything you know about this lead into clean, structured AE notes.\n\nFormat:\nBUSINESS CONTEXT:\n[2-3 sentences about the business]\n\nKEY INTELLIGENCE:\n- Competitor: ...\n- Reviews gap: ...\n- AI visibility: ...\n- Keyword: ...\n\nPAIN POINTS:\n- ...\n\nRECOMMENDED APPROACH:\n[What angle and product to lead with]\n\nNEXT BEST ACTION:\n[Specific next step]`;
}

function buildObjHandlingPrompt(lead) {
  if (!lead) return 'No lead selected.';
  const ctx = buildLeadContext(lead);
  const intel = lead.intelligence||{};
  return `${BIRDEYE_SYSTEM}\n\n${ctx}\n\n═══ TASK: OBJECTION HANDLING SCRIPTS ═══\nGenerate scripts for the top 5 objections for this lead.\n\nKnown objections: ${intel.objections?.join(', ')||'None logged yet — generate the most likely ones for a '+lead.industry+' business'}\n\nFor each objection:\nOBJECTION: "..."\nACKNOWLEDGE: ...\nREFRAME: ...\nEVIDENCE: (use the ${lead.industry} proof stats)\nCTA: ...`;
}

function getPromptForMode(mode, lead) {
  switch(mode) {
    case 'email':      return buildEmailPrompt(lead);
    case 'sms':        return buildSMSPrompt(lead);
    case 'voicemail':  return buildVoicemailPrompt(lead);
    case 'linkedin':   return buildLinkedinPrompt(lead);
    case 'situational':return buildSituationalPrompt(lead);
    case 'cadence':    return buildCadencePrompt(lead);
    case 'notes':      return buildAENotesPrompt(lead);
    case 'objections': return buildObjHandlingPrompt(lead);
    default:           return buildEmailPrompt(lead);
  }
}

async function callClaude(prompt, apiKey) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1800,messages:[{role:'user',content:prompt}]}),
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||`Claude API ${res.status}`); }
  return (await res.json()).content?.[0]?.text||'';
}

async function callGemini(prompt, apiKey) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1800,temperature:0.7}}),
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||`Gemini API ${res.status}`); }
  return (await res.json()).candidates?.[0]?.content?.parts?.[0]?.text||'';
}

async function callAI(prompt, settings) {
  const { aiProvider, claudeKey, geminiKey } = settings||{};
  if (aiProvider==='gemini' && geminiKey && !geminiKey.includes('•')) return callGemini(prompt, geminiKey);
  if (claudeKey && !claudeKey.includes('•')) return callClaude(prompt, claudeKey);
  return null; // no key configured — use copy-paste flow
}

async function transcribeWithGemini(base64Audio, mimeType, apiKey) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[
      {inline_data:{mime_type:mimeType,data:base64Audio}},
      {text:'Transcribe this sales call recording completely and accurately.\n\nAfter the transcript, provide:\n\nTRANSCRIPT:\n[full transcript]\n\n---\nSUMMARY:\nPAIN POINTS:\n- \nCOMPETITORS MENTIONED:\n- \nOBJECTIONS:\n- \nBUYING SIGNALS:\n- \nDECISION MAKERS:\n- \nSENTIMENT: [Positive/Neutral/Negative]\nNEXT BEST ACTION:\n'}
    ]}],generationConfig:{maxOutputTokens:4000}}),
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||`Gemini transcription ${res.status}`); }
  return (await res.json()).candidates?.[0]?.content?.parts?.[0]?.text||'';
}

function parseTranscriptAnalysis(text) {
  const get = (key) => { const m=text.match(new RegExp(`${key}:\\s*([\\s\\S]*?)(?=\\n[A-Z ]+:|$)`,'i')); return m?m[1].trim():''; };
  const list = (key) => get(key).split('\n').map(l=>l.replace(/^[-•*]\s*/,'')).filter(Boolean);
  const transcriptMatch = text.match(/TRANSCRIPT:\s*([\s\S]*?)(?=\n---|\nSUMMARY:)/i);
  return {
    transcript: transcriptMatch?transcriptMatch[1].trim():text,
    summary: get('SUMMARY'), painPoints: list('PAIN POINTS'),
    competitors: list('COMPETITORS MENTIONED'), objections: list('OBJECTIONS'),
    buyingSignals: list('BUYING SIGNALS'), decisionMakers: list('DECISION MAKERS'),
    sentiment: get('SENTIMENT'), nextBestAction: get('NEXT BEST ACTION'),
  };
}

  const [aiScan, setAiScan] = useState('');
  const [repGap, setRepGap] = useState('');
  const [parsed, setParsed] = useState(null);

    {key:'keyword',label:'Keyword'},

    {key:'reviews',label:'Est. Reviews',type:'number'},

  ];

  const parse = () => {
    setParsing(true);
    setTimeout(()=>{
      const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
      const result = {};

      // MQL date
      const dateM = raw.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}[\s,]+\d{1,2}:\d{2}\s*[AP]?M?)\b/i);
      result.mqlDate = dateM?dateM[1]:new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});

      lines.forEach(line=>{
        const lower = line.toLowerCase();
        const emailM = line.match(/[\w.+\-]+@[\w\-]+\.\w+/);
        if (emailM && !result.email) result.email=emailM[0];
        const phoneM = line.match(/\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}/);
        if (phoneM && !result.phone) result.phone=phoneM[0];
        if ((lower.includes('salesloft'))&&!result.salesloftUrl){const m=line.match(/https?:\/\/\S+/);result.salesloftUrl=m?m[0]:line.replace(/^salesloft[:\s]*/i,'').trim();}
        if ((lower.includes('google.com/maps')||lower.includes('goo.gl')||lower.includes('g.page')||/^gmb[:\s]/i.test(line))&&!result.gmbUrl){const m=line.match(/https?:\/\/\S+/);result.gmbUrl=m?m[0]:line.replace(/^gmb[:\s]*/i,'').trim();}
        if (/^keyword[:\s]/i.test(line)) result.keyword=line.replace(/^keyword[:\s]*/i,'').trim().slice(0,80);
        const compM=line.match(/(?:competitor[:\s]+|competing with[:\s]+|competitor is[:\s]+)(.+)/i);
        if (compM&&!result.competitor) result.competitor=compM[1].replace(/\(.*\)/,'').trim().slice(0,60);
        const revM=line.match(/(\d+)\s*reviews?/i);
        if (revM&&!result.reviews) result.reviews=parseInt(revM[1]);
        if (/,\s*[A-Z]{2}\b/.test(line)&&!result.city) result.city=line;
        if (!result.website&&(line.match(/^https?:\/\//)||/^\S+\.(com|co|io|net|org|dental|clinic|spa)$/i.test(line))&&!lower.includes('salesloft')&&!lower.includes('google')&&!lower.includes('g.page')) result.website=line.replace(/^https?:\/\//,'').replace(/\/$/,'');
        for(const[rx,ind]of[[/dental|dentist/i,'Dental'],[/spa|med.?spa/i,'Med Spa'],[/chiro/i,'Chiropractic'],[/wellness/i,'Wellness'],[/fitness|gym/i,'Fitness'],[/derm|skin/i,'Dermatology'],[/legal|law/i,'Legal']]) { if(rx.test(line)&&!result.industry){result.industry=ind;break;} }
        if (/ai.?visib|chatgpt|gemini|ai.*search/i.test(line)&&!result.intent) result.intent='AI Visibility';
        if (/review|rating/i.test(line)&&!result.intent) result.intent='Review Growth';
        if (/listing|gmb/i.test(line)&&!result.intent) result.intent='Listings';
        if (!result.business&&/^[A-Z]/.test(line)&&!line.includes('@')&&!line.match(/^https?:\/\//)&&line.length<80&&!lower.includes('keyword')&&!lower.includes('competitor')&&!lower.includes('salesloft')&&!lower.includes('gmb')) result.business=line;
      });

      result.intent||='AI Visibility';
      result.industry||='Healthcare';
      result.reviews||=0;

      // Generate AE notes
      const bm=getBirdeyeMatch(result.intent);
      const proof=getProof(result.industry||'Healthcare');
      const notes=[
        `BUSINESS CONTEXT:\n${result.business||'Unknown'} — ${result.intent} lead in ${result.city||'unknown location'}. Industry: ${result.industry||'unknown'}.`,
        result.keyword?`Keyword: ${result.keyword}`:'',
        result.competitor?`Competitor: ${result.competitor}${result.reviews?` — est. ${result.reviews} reviews vs competitor`:''}`:'' ,
        result.gmbUrl?`GMB URL: ${result.gmbUrl}`:'',
        result.salesloftUrl?`Salesloft: ${result.salesloftUrl}`:'',
        result.mqlDate?`MQL Date: ${result.mqlDate}`:'',
        aiScan?`\nAI SCAN:\n${aiScan.slice(0,300)}`:'',
        repGap?`\nREPUTATION GAP:\n${repGap.slice(0,200)}`:'',
        `\nBIRDEYE MATCH:\nProduct: ${bm.product}\nAgent: ${bm.agent}\nProof: ${proof.reviews} more reviews for ${result.industry} — ${proof.search} search view increase`,
      ].filter(Boolean).join('\n');

      setParsed(result);
      setFields({...result,stage:'New'});
      setAeNotes(notes);
      setParsing(false);
    },600);
  };

  const saveLead = () => {
