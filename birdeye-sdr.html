const LS = {

  save: (key, val) => { try { localStorage.setItem(key,JSON.stringify(val)); } catch {} },

const Ctx = createContext(null);
const useApp = () => useContext(Ctx);

function useTheme() {
  const { theme } = useApp();
  const dark = theme === 'dark';
  return {
    dark,
    T1: dark ? '#e6edf3' : '#111827',
    T2: dark ? '#8b949e' : '#6b7280',
    T3: dark ? '#484f58' : '#9ca3af',
    B1: dark ? '#30363d' : '#e5e7eb',
    S1: dark ? '#161b22' : '#ffffff',
    S2: dark ? '#0d1117' : '#f8f9fa',
    S3: dark ? '#21262d' : '#f3f4f5',
    BG: dark ? '#0d1117' : '#f8f9fa',
  };
}

function AppProvider({ children }) {
  const [theme,    setTheme]    = useState(() => localStorage.getItem('be_theme') || 'dark');
  const [view,     setViewRaw]  = useState('workqueue');
  const [leads,    setLeads]    = useState(() => LS.load('be_leads', MOCK_LEADS));
  const [cadences, setCadences] = useState(() => LS.load('be_cadences', MOCK_CADENCES));
  const [settings, setSettings] = useState(() => ({ ...DEFAULT_SETTINGS, ...LS.load('be_settings', {}) }));
  const [activeLead, setActiveLead] = useState(null);
  const [selected,   setSelected]   = useState(new Set());
  const [copilotOpen, setCopilotOpen] = useState(false);
  const [copilotMode, setCopilotMode] = useState('email');
  const [copilotLead, setCopilotLead] = useState(null);
  const [clipSearch,  setClipSearch]  = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);

  useEffect(() => {
    document.documentElement.className = theme;
    localStorage.setItem('be_theme', theme);
  }, [theme]);

  useEffect(() => { LS.save('be_leads',    leads);    }, [leads]);
  useEffect(() => { LS.save('be_cadences', cadences); }, [cadences]);
  useEffect(() => { LS.save('be_settings', settings); }, [settings]);

  const toggleTheme   = useCallback(() => setTheme(t => t==='dark'?'light':'dark'), []);
  const toggleSidebar = useCallback(() => setSidebarOpen(v => !v), []);
  const setView = useCallback((v) => { setActiveLead(null); setViewRaw(v); }, []);

  const updateLead = useCallback((id, patch) => {
    const up = l => l.id===id ? {...l,...patch} : l;
    setLeads(prev => prev.map(up));
    setActiveLead(prev => prev?.id===id ? {...prev,...patch} : prev);
  }, []);

  const updateIntelligence = useCallback((id, patch) => {
    setLeads(prev => prev.map(l => l.id===id ? {...l, intelligence:{...l.intelligence,...patch,lastUpdated:new Date().toISOString()}} : l));
    setActiveLead(prev => prev?.id===id ? {...prev, intelligence:{...prev.intelligence,...patch,lastUpdated:new Date().toISOString()}} : prev);
  }, []);

  const addLead = useCallback((data) => {
    const nl = makeLead({ ...data, id: Date.now() });
    setLeads(prev => [nl, ...prev]);
    return nl;
  }, []);

  const addActivity = useCallback((leadId, type, summary, details={}) => {
    const act = { activityId: Date.now()+Math.random(), timestamp: new Date().toISOString(), type, summary, details, outcome: details.outcome||null, source: details.source||'manual' };
    setLeads(prev => prev.map(l => l.id===leadId ? {...l, activities:[act,...(l.activities||[])]} : l));
    setActiveLead(prev => prev?.id===leadId ? {...prev, activities:[act,...(prev.activities||[])]} : prev);
    return act;
  }, []);

  const addMemory = useCallback((leadId, entry) => {
    const m = {...entry, id: Date.now()+Math.random()};
    setLeads(prev => prev.map(l => l.id===leadId ? {...l, memory:[m,...(l.memory||[])]} : l));
    setActiveLead(prev => prev?.id===leadId ? {...prev, memory:[m,...(prev.memory||[])]} : prev);
  }, []);

  const removeMemory = useCallback((leadId, memId) => {
    setLeads(prev => prev.map(l => l.id===leadId ? {...l, memory:(l.memory||[]).filter(m=>m.id!==memId)} : l));
    setActiveLead(prev => prev?.id===leadId ? {...prev, memory:(prev.memory||[]).filter(m=>m.id!==memId)} : prev);
  }, []);

  const openLead  = useCallback((lead) => setActiveLead(lead), []);
  const closeLead = useCallback(() => setActiveLead(null), []);

  const toggleSelect  = useCallback((id) => setSelected(prev => { const n=new Set(prev); n.has(id)?n.delete(id):n.add(id); return n; }), []);
  const selectAll     = useCallback((ids) => setSelected(new Set(ids)), []);
  const clearSelect   = useCallback(() => setSelected(new Set()), []);
  const bulkUpdateStage = useCallback((stage) => {
    setLeads(prev => prev.map(l => selected.has(l.id) ? {...l,stage} : l));
    setSelected(new Set());
  }, [selected]);

  const openCopilot  = useCallback((mode='email', lead=null) => { setCopilotMode(mode); setCopilotLead(lead); setCopilotOpen(true); }, []);
  const closeCopilot = useCallback(() => setCopilotOpen(false), []);

  const updateSettings = useCallback((patch) => setSettings(prev => ({...prev,...patch})), []);
  const saveCadence    = useCallback((c) => setCadences(prev => c.id ? prev.map(x=>x.id===c.id?c:x) : [...prev,{...c,id:Date.now()}]), []);
  const deleteCadence  = useCallback((id) => setCadences(prev => prev.filter(c=>c.id!==id)), []);

  return (
    <Ctx.Provider value={{
      theme, toggleTheme, sidebarOpen, toggleSidebar,
      view, setView,
      leads, addLead, updateLead, updateIntelligence,
      addActivity, addMemory, removeMemory,
      activeLead, openLead, closeLead,
      selected, toggleSelect, selectAll, clearSelect, bulkUpdateStage,
      copilotOpen, copilotMode, copilotLead, openCopilot, closeCopilot,
      clipSearch, setClipSearch,
      cadences, saveCadence, deleteCadence,
      settings, updateSettings,
    }}>
      {children}
    </Ctx.Provider>
  );
}

function getPrompt(mode, lead) {

    notes: `${base}\n\n═══ TASK: GENERATE AE NOTES ═══\nFormat:\nBUSINESS CONTEXT: [2-3 sentences]\nKEY INTELLIGENCE:\n- Competitor: ...\n- Reviews gap: ...\n- AI visibility: ...\nPAIN POINTS:\n- ...\nRECOMMENDED APPROACH: [angle + product]\nNEXT BEST ACTION: [specific step]`,
    objections: `${base}\n\n═══ TASK: OBJECTION HANDLING ═══\nTop 5 objections for a ${lead?.industry} business. For each:\nOBJECTION: "..."\nACKNOWLEDGE: ...\nREFRAME: ...\nEVIDENCE: (use ${lead?.industry} proof stats)\nCTA: ...`,
  };
  return prompts[mode] || prompts.email;
}

async function callClaude(prompt, key) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},
    body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:1800,messages:[{role:'user',content:prompt}]}),
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||`Claude API ${res.status}`); }
  return (await res.json()).content?.[0]?.text||'';
}
async function callGemini(prompt, key) {
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:1800,temperature:0.7}}),
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e?.error?.message||`Gemini API ${res.status}`); }
  return (await res.json()).candidates?.[0]?.content?.parts?.[0]?.text||'';
}
async function callAI(prompt, settings) {
  const { aiProvider, claudeKey, geminiKey } = settings||{};
  if (aiProvider==='gemini' && geminiKey && !geminiKey.includes('•')) return callGemini(prompt,geminiKey);
  if (claudeKey && !claudeKey.includes('•')) return callClaude(prompt,claudeKey);
  return null;
}

// ─────────────────────────────────────────────
function Dashboard() {
  const { leads, openCopilot } = useApp();
  const { T1, T2, B1, S1, S3 } = useTheme();
  const stats = useMemo(() => {
    const acts = leads.flatMap(l=>l.activities||[]);
    const emails = acts.filter(a=>a.type==='Email').length;
    const calls  = acts.filter(a=>a.type==='Call').length;
    const replies = acts.filter(a=>['Replied','Positive','Connected'].includes(a.outcome)).length;
    const rr = emails>0?Math.round(replies/emails*100):0;
    const avgScore = leads.length>0?Math.round(leads.reduce((s,l)=>s+(l.aiScore||0),0)/leads.length):0;
    const topIntents = Object.entries(leads.reduce((m,l)=>{const k=l.intent||'Unknown';m[k]=(m[k]||0)+1;return m;},{})).sort((a,b)=>b[1]-a[1]).slice(0,4);
    const stageMap = STAGES.map(s=>({stage:s,count:leads.filter(l=>l.stage===s).length}));
    const maxCount = Math.max(...stageMap.map(x=>x.count),1);
    const recentActs = [...acts].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).slice(0,5).map(a=>{const lead=leads.find(l=>(l.activities||[]).some(x=>x.activityId===a.activityId));return {...a,leadName:lead?.business||'—'};});
    return {emails,calls,replies,rr,avgScore,topIntents,stageMap,maxCount,recentActs};
  },[leads]);

  const cards = [
    {label:'Total Leads',value:leads.length,icon:'users',color:'#7c5ce8',bg:'rgba(91,63,200,0.12)'},
    {label:'Hot Leads',value:leads.filter(l=>l.stage==='Hot').length,icon:'flame',color:'#ef4444',bg:'rgba(239,68,68,0.12)'},
    {label:'Demo Booked',value:leads.filter(l=>l.stage==='Demo Booked').length,icon:'calendar',color:'#f59e0b',bg:'rgba(245,158,11,0.12)'},
    {label:'Reply Rate',value:`${stats.rr}%`,icon:'trending',color:'#10b981',bg:'rgba(16,185,129,0.12)',delta:`${stats.replies} replies`},
    {label:'Emails Logged',value:stats.emails,icon:'mail',color:'#3b82f6',bg:'rgba(59,130,246,0.12)'},
    {label:'Calls Logged',value:stats.calls,icon:'phone',color:'#10b981',bg:'rgba(16,185,129,0.12)'},
    {label:'Converted',value:leads.filter(l=>l.stage==='Converted').length,icon:'checkCircle',color:'#10b981',bg:'rgba(16,185,129,0.12)'},
    {label:'Avg AI Score',value:stats.avgScore,icon:'target',color:'#7c5ce8',bg:'rgba(91,63,200,0.12)'},
  ];

  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:18}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:700,color:T1,margin:0}}>Dashboard</h1>
          <p style={{fontSize:12,color:T2,marginTop:4}}>Live metrics from {leads.length} leads</p>
        </div>
        <Btn onClick={()=>openCopilot('situational',null)}><Ico name="sparkles" size={12}/>AI Copilot</Btn>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        {cards.map(c => (
          <div key={c.label} style={{background:S1,border:`1px solid ${B1}`,borderRadius:12,padding:'16px 18px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <span style={{fontSize:10,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.06em'}}>{c.label}</span>
              <div style={{width:26,height:26,borderRadius:7,background:c.bg,display:'flex',alignItems:'center',justifyContent:'center'}}><Ico name={c.icon} size={13} color={c.color}/></div>
            </div>
            <div style={{fontSize:28,fontWeight:700,color:T1,fontFamily:'JetBrains Mono,monospace',lineHeight:1}}>{c.value}</div>
            {c.delta && <div style={{fontSize:10,color:T2,marginTop:5}}>{c.delta}</div>}
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 260px 280px',gap:14}}>
        {/* Stage distribution */}
        <div style={{background:S1,border:`1px solid ${B1}`,borderRadius:14,padding:18}}>
          <div style={{fontSize:13,fontWeight:600,color:T1,marginBottom:14}}>Stage Distribution</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {stats.stageMap.map(({stage,count}) => {
              const ss = STAGE_STYLE[stage]||STAGE_STYLE['New'];
              return (
                <div key={stage}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                    <span style={{fontSize:12,color:T1}}>{stage}</span>
                    <span style={{fontSize:12,fontWeight:700,color:ss.color,fontFamily:'JetBrains Mono,monospace'}}>{count}</span>
                  </div>
                  <div style={{height:6,background:S3,borderRadius:99,overflow:'hidden'}}>
                    <div style={{height:6,width:`${count/stats.maxCount*100}%`,background:ss.color,borderRadius:99,opacity:.85,transition:'width 0.5s ease'}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
        {/* Top intents */}
        <div style={{background:S1,border:`1px solid ${B1}`,borderRadius:14,padding:18}}>
          <div style={{fontSize:13,fontWeight:600,color:T1,marginBottom:14}}>Top Intents</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {stats.topIntents.length===0?<span style={{fontSize:12,color:T2,fontStyle:'italic'}}>No leads yet</span>:
            stats.topIntents.map(([intent,count],i) => {
              const pct = Math.round(count/leads.length*100);
              const colors=['#7c5ce8','#3b82f6','#10b981','#f59e0b'];
              return (
                <div key={intent}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                    <span style={{fontSize:11,color:T1}}>{intent}</span>
                    <span style={{fontSize:11,fontWeight:600,color:T2}}>{pct}%</span>
                  </div>
                  <div style={{height:5,background:S3,borderRadius:99,overflow:'hidden'}}>
                    <div style={{height:5,width:`${pct}%`,background:colors[i]||'#7c5ce8',borderRadius:99,transition:'width 0.5s ease'}}/>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
        {/* Recent activity */}
        <div style={{background:S1,border:`1px solid ${B1}`,borderRadius:14,padding:18}}>
          <div style={{fontSize:13,fontWeight:600,color:T1,marginBottom:14}}>Recent Activity</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {stats.recentActs.length===0?<span style={{fontSize:12,color:T2,fontStyle:'italic'}}>No activities logged yet</span>:
            stats.recentActs.map((act,i) => (
              <div key={act.activityId||i} style={{display:'flex',gap:8}}>
                <div style={{width:26,height:26,borderRadius:7,background:S3,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,fontSize:12}}>
                  {act.type==='Call'?'📞':act.type==='Email'?'✉️':act.type==='SMS'?'💬':'📝'}
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:11,fontWeight:600,color:T1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{act.leadName}</div>
                  <div style={{fontSize:10,color:T2}}>{act.type} · {new Date(act.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function MyLeads() {
  const { leads, openLead, selected, toggleSelect, selectAll, clearSelect, bulkUpdateStage } = useApp();
  const { dark, T1, T2, B1, S1 } = useTheme();
  const [search, setSearch] = useState('');
  const [stageF, setStageF] = useState('All');
  const [intentF, setIntentF] = useState('All');

  const filtered = useMemo(() => {
    let r = [...leads];

    if (intentF!=='All') r=r.filter(l=>l.intent===intentF);
    return r.sort((a,b)=>b.aiScore-a.aiScore);
  },[leads,search,stageF,intentF]);

  const allIds = filtered.map(l=>l.id);
  const allSel = allIds.length>0&&allIds.every(id=>selected.has(id));
  const COL = '28px minmax(0,1.6fr) 100px 52px 90px 72px 80px 90px 30px';

  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:14}}>

        <div>
          <h1 style={{fontSize:20,fontWeight:700,color:T1,margin:0}}>My Leads</h1>

      </div>

          <Ico name="search" size={13} color={T2}/>

        </div>

// PIPELINE (KANBAN)
// ─────────────────────────────────────────────
function Pipeline() {
  const { leads, updateLead, openLead } = useApp();
  const { dark, T1, T2, B1, S2 } = useTheme();
  const [over, setOver] = useState(null);
  const cols = STAGES.slice(0,7);
  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:14}}>
      <div>
        <h1 style={{fontSize:20,fontWeight:700,color:T1,margin:0}}>Pipeline</h1>
        <p style={{fontSize:12,color:T2,marginTop:3}}>Drag leads between stages</p>
      </div>
      <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8}}>
        {cols.map(stage=>{
          const ss = STAGE_STYLE[stage]||STAGE_STYLE['New'];
          const items = leads.filter(l=>l.stage===stage);
          const isOver = over===stage;
          return (
            <div key={stage}
              onDragOver={e=>{e.preventDefault();setOver(stage);}}
              onDragLeave={()=>setOver(null)}
              onDrop={e=>{e.preventDefault();const id=parseInt(e.dataTransfer.getData('lid'));if(id)updateLead(id,{stage});setOver(null);}}
              style={{flex:'0 0 200px',display:'flex',flexDirection:'column',background:isOver?ss.bg:'var(--s2)',border:`1px solid ${isOver?ss.color:B1}`,borderRadius:12,overflow:'hidden',transition:'all 0.15s',minHeight:400}}>
              <div style={{padding:'10px 12px',borderBottom:`1px solid ${B1}`,background:dark?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.03)',flexShrink:0}}>
                <div style={{display:'flex',alignItems:'center',gap:6}}>
                  <div style={{width:8,height:8,borderRadius:'50%',background:ss.color}}/>
                  <span style={{fontSize:11,fontWeight:600,color:T1}}>{stage}</span>
                  <span style={{fontSize:10,fontWeight:700,color:ss.color,background:`${ss.color}20`,padding:'0 5px',borderRadius:99,fontFamily:'JetBrains Mono,monospace'}}>{items.length}</span>
                </div>
              </div>
              <div style={{flex:1,overflowY:'auto',padding:'8px 6px',display:'flex',flexDirection:'column',gap:6}}>
                {items.length===0?(
                  <div style={{padding:'16px 8px',textAlign:'center',color:dark?'rgba(72,79,88,0.5)':'rgba(156,163,175,0.7)',fontSize:11,border:`1.5px dashed ${dark?'#21262d':'#e5e7eb'}`,borderRadius:8}}>Drop here</div>
                ):items.map(lead=>{
                  const is = INTENT_STYLE[lead.intent]||INTENT_STYLE['AI Visibility'];
                  return (
                    <div key={lead.id}
                      draggable
                      onDragStart={e=>e.dataTransfer.setData('lid',lead.id)}
                      onClick={()=>openLead(lead)}
                      style={{background:dark?'#161b22':'#fff',border:`1px solid ${B1}`,borderRadius:9,padding:'10px',cursor:'grab',transition:'border-color 0.15s'}}
                      onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(91,63,200,0.4)'}
                      onMouseLeave={e=>e.currentTarget.style.borderColor=B1}>
                      <div style={{fontSize:11,fontWeight:600,color:T1,marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lead.business}</div>
                      <span style={{...is,fontSize:9,fontWeight:500,padding:'1px 6px',borderRadius:99,display:'inline-block',marginBottom:5}}>{lead.intent}</span>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                        <span style={{fontSize:9,color:T2}}>{lead.lastTouch}</span>
                        <span style={{fontSize:10,fontWeight:700,color:lead.aiScore>=80?'#10b981':lead.aiScore>=65?'#f59e0b':'#ef4444',fontFamily:'JetBrains Mono,monospace'}}>{lead.aiScore}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// REPORTS
// ─────────────────────────────────────────────
function Reports() {
  const { leads } = useApp();
  const { T1, T2, B1, S1, S3 } = useTheme();
  const s = useMemo(()=>{
    const acts=leads.flatMap(l=>l.activities||[]);
    const emails=acts.filter(a=>a.type==='Email').length;
    const calls=acts.filter(a=>a.type==='Call').length;
    const sms=acts.filter(a=>a.type==='SMS').length;
    const replies=acts.filter(a=>['Replied','Positive','Connected'].includes(a.outcome)).length;
    const rr=emails>0?parseFloat((replies/emails*100).toFixed(1)):0;
    const funnel=[{label:'ACCOUNTS',value:leads.length,emoji:'🏢'},{label:'CONTACTED',value:leads.filter(l=>l.stage!=='New').length,emoji:'👤'},{label:'TOUCHED',value:emails+calls+sms,emoji:'📨'},{label:'REPLIED',value:replies,emoji:'💬'},{label:'DEMO',value:leads.filter(l=>l.stage==='Demo Booked').length,emoji:'📅'}];
    const byType=[{label:'Email',count:emails,color:'#7c5ce8'},{label:'Call',count:calls,color:'#10b981'},{label:'SMS',count:sms,color:'#3b82f6'}];
    const max=Math.max(...byType.map(x=>x.count),1);
    return {emails,calls,sms,replies,rr,funnel,byType,max};
  },[leads]);
  return (
    <div className="fade-up" style={{display:'flex',flexDirection:'column',gap:18}}>
      <div>
        <h1 style={{fontSize:22,fontWeight:700,color:T1,margin:0}}>Reports & Analytics</h1>
        <p style={{fontSize:12,color:T2,marginTop:4}}>Live data from {leads.length} leads and {leads.flatMap(l=>l.activities||[]).length} activities</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
        {[{label:'Total Leads',value:leads.length,icon:'users',color:'#7c5ce8',bg:'rgba(91,63,200,0.12)'},{label:'Emails Logged',value:s.emails,delta:`${s.rr}% reply rate`,icon:'mail',color:'#3b82f6',bg:'rgba(59,130,246,0.12)'},{label:'Replies',value:s.replies,icon:'trending',color:'#10b981',bg:'rgba(16,185,129,0.12)'},{label:'Demos Booked',value:leads.filter(l=>l.stage==='Demo Booked').length,icon:'calendar',color:'#f59e0b',bg:'rgba(245,158,11,0.12)'}].map(c=>(
          <div key={c.label} style={{background:S1,border:`1px solid ${B1}`,borderRadius:12,padding:'16px 18px'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <span style={{fontSize:10,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.06em'}}>{c.label}</span>
              <div style={{width:26,height:26,borderRadius:7,background:c.bg,display:'flex',alignItems:'center',justifyContent:'center'}}><Ico name={c.icon} size={13} color={c.color}/></div>
            </div>
            <div style={{fontSize:28,fontWeight:700,color:T1,fontFamily:'JetBrains Mono,monospace',lineHeight:1}}>{c.value}</div>
            {c.delta&&<p style={{fontSize:10,color:T2,margin:'5px 0 0'}}>{c.delta}</p>}
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 240px',gap:14}}>
        {/* Funnel */}
        <div style={{background:S1,border:`1px solid ${B1}`,borderRadius:14,padding:20}}>
          <div style={{fontSize:13,fontWeight:600,color:T1,marginBottom:18}}>Outreach Funnel</div>
          <div style={{display:'flex',justifyContent:'space-between',position:'relative'}}>
            <div style={{position:'absolute',top:20,left:'5%',right:'5%',height:1,background:B1}}/>
            {s.funnel.map(({label,value,emoji},i)=>(
              <div key={label} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,flex:1}}>
                <div style={{width:40,height:40,borderRadius:'50%',background:'var(--s2)',border:`2px solid ${i===s.funnel.length-1?'#f59e0b':'rgba(91,63,200,0.4)'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,zIndex:1}}>{emoji}</div>
                <div style={{textAlign:'center'}}>
                  <div style={{fontSize:9,color:T2,textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:2}}>{label}</div>
                  <div style={{fontSize:20,fontWeight:700,color:i===s.funnel.length-1?'#f59e0b':T1,fontFamily:'JetBrains Mono,monospace'}}>{value}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
        {/* Activity breakdown */}
        <div style={{background:S1,border:`1px solid ${B1}`,borderRadius:14,padding:20}}>
          <div style={{fontSize:13,fontWeight:600,color:T1,marginBottom:14}}>Activity Breakdown</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {s.byType.map(({label,count,color})=>(
              <div key={label}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                  <span style={{fontSize:12,color:T1}}>{label}</span>
                  <span style={{fontSize:12,fontWeight:700,color,fontFamily:'JetBrains Mono,monospace'}}>{count}</span>
                </div>
                <div style={{height:6,background:S3,borderRadius:99,overflow:'hidden'}}>
                  <div style={{height:6,width:`${count/s.max*100}%`,background:color,borderRadius:99,transition:'width 0.5s ease'}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function NewLead() {
  const { addLead, setView } = useApp();
  const { T1, T2, B1, S1, BG } = useTheme();
  const [raw, setRaw] = useState('Lead received: 05/30/2025 10:42 AM\n\nSmileCraft Dental\nsarah@smilecraftdental.com\n(512) 555-0198\nAustin, TX\nhttps://smilecraftdental.com\nSalesloft: https://app.salesloft.com/people/12345678\nGMB: https://g.page/smilecraft\nKeyword: dental austin\nCompetitor is Glow Dental (412 reviews)');
  const [parsed, setParsed] = useState(null);
  const [fields, setFields] = useState({});
  const [aeNotes, setAeNotes] = useState('');
  const [parsing, setParsing] = useState(false);
  const [saved, setSaved] = useState(false);

  const FIELD_DEFS = [{key:'business',label:'Business'},{key:'contact',label:'Contact'},{key:'email',label:'Email'},{key:'phone',label:'Phone'},{key:'city',label:'City'},{key:'website',label:'Website'},{key:'intent',label:'Intent',type:'select',options:INTENTS},{key:'industry',label:'Industry',type:'select',options:INDUSTRIES},{key:'keyword',label:'Keyword'},{key:'competitor',label:'Competitor'},{key:'reviews',label:'Reviews',type:'number'},{key:'mqlDate',label:'MQL Date',readOnly:true},{key:'salesloftUrl',label:'Salesloft URL'},{key:'gmbUrl',label:'GMB URL'}];

  const parse = () => {
    setParsing(true);
    setTimeout(()=>{
      const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
      const r={};
      const dm=raw.match(/\b(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}[\s,]+\d{1,2}:\d{2}\s*[AP]?M?)\b/i);
      r.mqlDate=dm?dm[1]:new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
      lines.forEach(line=>{
        const lower=line.toLowerCase();
        const em=line.match(/[\w.+\-]+@[\w\-]+\.\w+/);if(em&&!r.email)r.email=em[0];
        const ph=line.match(/\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}/);if(ph&&!r.phone)r.phone=ph[0];
        if(lower.includes('salesloft')&&!r.salesloftUrl){const m=line.match(/https?:\/\/\S+/);r.salesloftUrl=m?m[0]:line.replace(/^salesloft[:\s]*/i,'').trim();}
        if((lower.includes('google.com/maps')||lower.includes('goo.gl')||lower.includes('g.page')||/^gmb[:\s]/i.test(line))&&!r.gmbUrl){const m=line.match(/https?:\/\/\S+/);r.gmbUrl=m?m[0]:'';}
        if(/^keyword[:\s]/i.test(line))r.keyword=line.replace(/^keyword[:\s]*/i,'').trim();
        const cm=line.match(/(?:competitor[:\s]+|competitor is[:\s]*)(.+)/i);if(cm&&!r.competitor)r.competitor=cm[1].replace(/\(.*\)/,'').trim().slice(0,60);
        const rv=line.match(/(\d+)\s*reviews?/i);if(rv&&!r.reviews)r.reviews=parseInt(rv[1]);
        if(/,\s*[A-Z]{2}\b/.test(line)&&!r.city)r.city=line;
        if(!r.website&&(line.match(/^https?:\/\//)||/^\S+\.(com|co|io|net|org)$/i.test(line))&&!lower.includes('salesloft')&&!lower.includes('google')&&!lower.includes('g.page'))r.website=line.replace(/^https?:\/\//,'').replace(/\/$/,'');
        for(const[rx,ind]of[[/dental|dentist/i,'Dental'],[/spa|med.?spa/i,'Med Spa'],[/chiro/i,'Chiropractic'],[/wellness/i,'Wellness'],[/fitness|gym/i,'Fitness'],[/derm|skin/i,'Dermatology'],[/legal|law/i,'Legal']]){if(rx.test(line)&&!r.industry){r.industry=ind;break;}}
        if(/ai.?visib|chatgpt|gemini/i.test(line)&&!r.intent)r.intent='AI Visibility';
        if(/review|rating/i.test(line)&&!r.intent)r.intent='Review Growth';
        if(/listing|gmb/i.test(line)&&!r.intent)r.intent='Listings';
        if(!r.business&&/^[A-Z]/.test(line)&&!line.includes('@')&&!line.match(/^https?:\/\//)&&line.length<80&&!lower.includes('keyword')&&!lower.includes('competitor')&&!lower.includes('salesloft')&&!lower.includes('gmb'))r.business=line;
      });
      r.intent=r.intent||'AI Visibility';r.industry=r.industry||'Healthcare';r.reviews=r.reviews||0;
      const bm=getBirdeyeMatch(r.intent);const proof=getProof(r.industry);
      const notes=[
        `BUSINESS CONTEXT:\n${r.business||'Unknown'} — ${r.intent} lead in ${r.city||'unknown'}. Industry: ${r.industry}.`,
        r.keyword?`Keyword: ${r.keyword}`:'',r.competitor?`Competitor: ${r.competitor}`:'' ,
        r.gmbUrl?`GMB: ${r.gmbUrl}`:'',r.salesloftUrl?`Salesloft: ${r.salesloftUrl}`:'',
        r.mqlDate?`MQL Date: ${r.mqlDate}`:'',
        `\nBIRDEYE MATCH:\nProduct: ${bm.product}\nAgent: ${bm.agent}\nProof: ${proof.reviews} more reviews, ${proof.search} search views for ${r.industry}`,
      ].filter(Boolean).join('\n');
      setParsed(r);setFields({...r,stage:'New'});setAeNotes(notes);setParsing(false);
    },500);
  };

  const saveLead = () => {
    addLead({...fields,reviews:parseInt(fields.reviews)||0,rating:0,aiVisibility:0,compGap:fields.competitor?'High':'Medium',nextAction:'Initial Outreach',lastTouch:'Never',stage:fields.stage||'New',cadenceDay:0,cadenceTotal:7,tags:['New'],aeNotes});
    setSaved(true);setTimeout(()=>setView('workqueue'),1300);
  };

  const inp={width:'100%',padding:'5px 8px',borderRadius:7,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:11,fontFamily:'inherit',outline:'none'};
  return (
    <div className="fade-up" style={{maxWidth:1000}}>
      <div style={{marginBottom:16}}>
        <h1 style={{fontSize:20,fontWeight:700,color:T1,margin:0}}>New Lead — Smart Parser</h1>
        <p style={{fontSize:12,color:T2,marginTop:3}}>Paste any raw data — email, notes, GMB URL, Salesloft URL, keywords. We extract everything and auto-generate AE notes with Birdeye intelligence.</p>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
        {/* Left */}
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <Card>
            <div style={{fontSize:11,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>Raw Lead Data</div>
            <textarea value={raw} onChange={e=>{setRaw(e.target.value);setParsed(null);}} rows={12} placeholder="Paste raw data — email, notes, GMB URL, Salesloft URL, keyword, competitor…" style={{width:'100%',padding:10,borderRadius:8,resize:'vertical',border:`1px solid ${B1}`,outline:'none',background:BG,color:T1,fontSize:11,fontFamily:'JetBrains Mono,monospace',lineHeight:1.7}} onFocus={e=>e.target.style.borderColor='var(--p)'} onBlur={e=>e.target.style.borderColor=B1}/>
          </Card>
          <Btn onClick={parse} disabled={!raw.trim()||parsing} size="lg" style={{width:'100%',justifyContent:'center'}}>
            {parsing?<><Spinner size={12}/> Parsing…</>:<><Ico name="sparkles" size={14}/>Parse &amp; Generate AE Notes</>}
          </Btn>
        </div>
        {/* Right */}
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <Card>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
              <span style={{fontSize:11,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.06em'}}>Extracted Information</span>
              {parsed&&<span style={{fontSize:11,color:'#10b981',fontWeight:600,display:'flex',alignItems:'center',gap:4}}><Ico name="checkCircle" size={12} color="#10b981"/> Parsed</span>}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:4}}>
              {FIELD_DEFS.map(({key,label,type,options,readOnly})=>{
                const val=fields[key]||'';const det=parsed&&parsed[key];
                return (
                  <div key={key} style={{display:'grid',gridTemplateColumns:'100px 1fr 14px',gap:6,alignItems:'center',padding:'5px 8px',borderRadius:7,border:`1px solid ${det?'rgba(16,185,129,0.3)':B1}`,background:det?'rgba(16,185,129,0.04)':'var(--s2)',transition:'all 0.2s'}}>
                    <div style={{fontSize:9,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.04em'}}>{label}</div>

                    type==='number'?<input type="number" value={val} onChange={e=>setFields(f=>({...f,[key]:e.target.value}))} disabled={!parsed} style={inp}/>:
                    <input value={val} onChange={e=>setFields(f=>({...f,[key]:e.target.value}))} disabled={!parsed} placeholder={parsed?'—':'parse first'} style={inp}/>}

              <div style={{display:'grid',gridTemplateColumns:'100px 1fr 14px',gap:6,alignItems:'center',padding:'5px 8px',borderRadius:7,border:`1px solid ${B1}`,background:'var(--s2)'}}>
                <div style={{fontSize:9,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.04em'}}>Stage</div>
                <select value={fields.stage||'New'} onChange={e=>setFields(f=>({...f,stage:e.target.value}))} disabled={!parsed} style={{...inp,background:'transparent',appearance:'none'}}>{STAGES.map(s=><option key={s}>{s}</option>)}</select>
                <div/>

          </Card>
          {parsed&&(
            <div style={{background:S1,border:'1px solid rgba(91,63,200,0.3)',borderRadius:12,padding:14}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}><Ico name="brain" size={13} color="var(--p-glow)"/><span style={{fontSize:11,fontWeight:600,color:'var(--p-glow)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Auto-Generated AE Notes</span></div>
              <textarea value={aeNotes} onChange={e=>setAeNotes(e.target.value)} rows={7} style={{width:'100%',padding:'8px 10px',borderRadius:8,border:`1px solid ${B1}`,outline:'none',background:BG,color:T1,fontSize:11,fontFamily:'JetBrains Mono,monospace',lineHeight:1.7,resize:'vertical'}} onFocus={e=>e.target.style.borderColor='var(--p)'} onBlur={e=>e.target.style.borderColor=B1}/>
            </div>
          )}
          {parsed&&!saved&&<Btn onClick={saveLead} size="lg" style={{width:'100%',justifyContent:'center'}}><Ico name="plus" size={14}/>Save Lead to Workspace</Btn>}
          {saved&&<div style={{display:'flex',alignItems:'center',gap:8,padding:'12px 14px',borderRadius:9,background:'rgba(16,185,129,0.1)',border:'1px solid rgba(16,185,129,0.25)'}}><Ico name="checkCircle" size={14} color="#10b981"/><span style={{fontSize:12,fontWeight:600,color:'#10b981'}}>Saved! Redirecting to Work Queue…</span></div>}

// Call Notes Modal
function CallNotesModal({ lead, onClose }) {
  const { addActivity, updateIntelligence, updateLead } = useApp();
  const { T1, T2, B1, S1, BG } = useTheme();
  const [outcome, setOutcome] = useState('Connected');
  const [sentiment, setSentiment] = useState('Neutral');
  const [duration, setDuration] = useState('');
  const [callNotes, setCallNotes] = useState('');
  const [nextStep, setNextStep] = useState('');
  const [saved, setSaved] = useState(false);
  const save = () => {
    addActivity(lead.id,'Call',`Call ${outcome} — ${duration?duration+'min ':''} ${sentiment}`,{outcome,notes:callNotes,nextStep,duration,sentiment,content:callNotes});
    if (callNotes) {
      const intel=lead.intelligence||{};const up={};
      const cm=callNotes.match(/competitor[:\s]+([^\n.]+)/i);if(cm)up.competitors=[...new Set([...(intel.competitors||[]),cm[1].trim()])];
      if(sentiment==='Positive'||sentiment==='Very Positive')up.buyingSignals=[...new Set([...(intel.buyingSignals||[]),`Positive call ${new Date().toLocaleDateString()}`])];
      if(callNotes)up.lastConversation=callNotes.slice(0,300);if(nextStep)up.nextBestAction=nextStep;
      if(Object.keys(up).length)updateIntelligence(lead.id,up);
    }
    if(nextStep)updateLead(lead.id,{nextAction:nextStep});
    setSaved(true);setTimeout(onClose,1100);
  };
  const inp={width:'100%',padding:'7px 10px',borderRadius:8,border:`1px solid ${B1}`,background:'var(--s2)',color:T1,fontSize:12,fontFamily:'inherit',outline:'none'};

            <div><div style={{fontSize:14,fontWeight:700,color:T1}}>Add Call Notes</div><div style={{fontSize:11,color:T2}}>{lead.business}</div></div>
          </div>
          <button onClick={onClose} style={{padding:5,border:'none',background:'transparent',cursor:'pointer',color:T2,display:'flex'}}><Ico name="x" size={15}/></button>
        </div>
        <div style={{padding:20,display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 90px',gap:10}}>

// Timeline Tab
function TimelineTab({ lead }) {
  const { T1, T2, B1 } = useTheme();
  const acts = [...(lead.activities||[])].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
  if (acts.length===0) return EmptyState({icon:'🕐',title:'No timeline entries',sub:'Log calls and emails to build history.'});
  const grouped = acts.reduce((g,a)=>{const k=new Date(a.timestamp).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});(g[k]||(g[k]=[])).push(a);return g;},{});
  return (
    <div style={{display:'flex',flexDirection:'column',gap:0}}>
      {Object.entries(grouped).map(([date,items])=>(
        <div key={date}>
          <div style={{fontSize:10,fontWeight:700,color:T2,textTransform:'uppercase',letterSpacing:'0.06em',padding:'14px 0 8px',borderBottom:`1px solid ${B1}`,marginBottom:12}}>{date}</div>
          <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20,position:'relative',paddingLeft:40}}>
            <div style={{position:'absolute',left:14,top:0,bottom:-20,width:2,background:B1}}/>
            {items.map((act,i)=>(
              <div key={act.activityId||i} style={{display:'flex',alignItems:'flex-start',gap:12,position:'relative'}}>
                <div style={{position:'absolute',left:-26,zIndex:1}}><ActIcon type={act.type}/></div>
                <div style={{background:'var(--bg)',border:`1px solid ${B1}`,borderRadius:10,padding:'10px 14px',flex:1}}>
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:act.details?.content?6:0}}>
                    <span style={{fontSize:12,fontWeight:600,color:T1}}>{act.summary}</span>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      {act.outcome&&<span style={{fontSize:10,fontWeight:600,color:outcomeColor(act.outcome)}}>{act.outcome}</span>}
                      <span style={{fontSize:10,color:T2}}>{new Date(act.timestamp).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</span>

                  </div>

      ))}

  );
}

const COPILOT_MODES = [
  {id:'email',label:'Email',icon:'mail',desc:'3 personalised email variations',color:'#7c5ce8',bg:'rgba(91,63,200,0.12)'},
  {id:'sms',label:'SMS',icon:'phone',desc:'3 SMS messages',color:'#3b82f6',bg:'rgba(59,130,246,0.12)'},
  {id:'voicemail',label:'Voicemail',icon:'mic',desc:'30-sec script',color:'#f59e0b',bg:'rgba(245,158,11,0.12)'},
  {id:'linkedin',label:'LinkedIn',icon:'linkedin',desc:'Connection + 2 follow-ups',color:'#0a66c2',bg:'rgba(10,102,194,0.12)'},
  {id:'situational',label:'Situational',icon:'brain',desc:'Best move right now',color:'#ec4899',bg:'rgba(236,72,153,0.12)'},
  {id:'cadence',label:'Cadence',icon:'zap',desc:'Full 7-step sequence',color:'#7c5ce8',bg:'rgba(91,63,200,0.12)'},
  {id:'notes',label:'AE Notes',icon:'fileText',desc:'Auto-generate notes',color:'#38bdf8',bg:'rgba(56,189,248,0.12)'},
  {id:'objections',label:'Objections',icon:'target',desc:'Objection scripts',color:'#10b981',bg:'rgba(16,185,129,0.12)'},
];

function CopilotModal() {
  const { copilotOpen, copilotMode, copilotLead, closeCopilot, activeLead, addActivity, updateLead, settings } = useApp();
  const { dark, T1, T2, B1, S1, BG } = useTheme();
  const [mode, setMode] = useState(null);
  const [step, setStep] = useState(0);
  const [prompt, setPrompt] = useState('');
  const [output, setOutput] = useState('');
  const [copied, setCopied] = useState(false);
  const [generating, setGenerating] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState('');
  const lead = copilotLead || activeLead || null;
  const hasKey = (settings?.aiProvider==='gemini'&&settings?.geminiKey&&!settings.geminiKey.includes('•')) || (settings?.claudeKey&&!settings.claudeKey.includes('•'));

  useEffect(()=>{
    if(copilotOpen && copilotMode && copilotMode!=='search'){
      setMode(copilotMode);setStep(1);setOutput('');setError('');setPrompt(getPrompt(copilotMode,lead));
    } else if(copilotOpen){ setMode(null);setStep(0);setPrompt('');setOutput('');setError(''); }
  },[copilotOpen,copilotMode]);

  if (!copilotOpen) return null;
  const modeInfo = COPILOT_MODES.find(m=>m.id===mode)||COPILOT_MODES[0];
  const selectMode = m => { setMode(m);setStep(1);setOutput('');setError('');setPrompt(getPrompt(m,lead)); };
  const copyPrompt = () => { navigator.clipboard.writeText(prompt);setCopied(true);setTimeout(()=>setCopied(false),2500); };
  const generateDirect = async () => {
    setGenerating(true);setError('');setOutput('');
    try { const r=await callAI(prompt,settings);if(r){setOutput(r);setStep(2);}else setError('No API key configured. Copy the prompt and paste into Claude.ai or Gemini.'); }
    catch(e){setError(e.message);} finally{setGenerating(false);}
  };
  const saveOutput = () => {
    if(lead){ addActivity(lead.id,modeInfo.label,`${modeInfo.label} via AI Copilot`,{content:output,source:'copilot'});
      if(mode==='notes')updateLead(lead.id,{aeNotes:output}); }
    setSaved(true);setTimeout(()=>closeCopilot(),1200);
  };

  return (
    <>
      <div onClick={closeCopilot} style={{position:'fixed',inset:0,zIndex:99,background:'rgba(0,0,0,0.6)',backdropFilter:'blur(4px)'}}/>
      <div style={{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:580,maxHeight:'88vh',zIndex:100,borderRadius:16,background:S1,border:`1px solid ${B1}`,boxShadow:'0 24px 64px rgba(0,0,0,0.55)',display:'flex',flexDirection:'column',fontFamily:'inherit',overflow:'hidden'}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:`1px solid ${B1}`,flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:'var(--p)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(91,63,200,0.4)'}}><Ico name="sparkles" size={17} color="#fff"/></div>
            <div>
              <div style={{fontSize:14,fontWeight:700,color:T1}}>Birdeye AI Copilot</div>
              <div style={{fontSize:11,color:T2,marginTop:1}}>{mode?`${modeInfo.label} — ${lead?lead.business:'No lead selected'}`:'What would you like to generate?'}</div>
            </div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            {lead&&<div style={{fontSize:10,padding:'2px 8px',borderRadius:99,background:'var(--p-chip)',color:'var(--p-glow)',fontWeight:600}}>{lead.business}</div>}
            <button onClick={closeCopilot} style={{padding:5,border:'none',background:'transparent',cursor:'pointer',color:T2,display:'flex'}}><Ico name="x" size={15}/></button>
          </div>
        </div>
        {/* Body */}
        <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
          {step===0&&(
            <div style={{padding:'16px 20px',display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
              {COPILOT_MODES.map(m=>(
                <button key={m.id} onClick={()=>selectMode(m.id)} style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:7,padding:12,borderRadius:10,border:`1px solid ${B1}`,background:dark?'rgba(255,255,255,0.02)':'rgba(0,0,0,0.02)',cursor:'pointer',textAlign:'left',fontFamily:'inherit',transition:'all 0.15s'}}
                  onMouseEnter={e=>{e.currentTarget.style.borderColor=m.color;e.currentTarget.style.background=m.bg;}}
                  onMouseLeave={e=>{e.currentTarget.style.borderColor=B1;e.currentTarget.style.background=dark?'rgba(255,255,255,0.02)':'rgba(0,0,0,0.02)';}}>
                  <div style={{width:28,height:28,borderRadius:7,background:m.bg,display:'flex',alignItems:'center',justifyContent:'center'}}><Ico name={m.icon} size={14} color={m.color}/></div>
                  <div><div style={{fontSize:12,fontWeight:600,color:T1}}>{m.label}</div><div style={{fontSize:10,color:T2,marginTop:1,lineHeight:1.4}}>{m.desc}</div></div>
                </button>
              ))}
            </div>
          )}
          {step===1&&(
            <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:12}}>
              {!lead&&<div style={{padding:'8px 12px',borderRadius:8,background:'rgba(245,158,11,0.08)',border:'1px solid rgba(245,158,11,0.2)',fontSize:12,color:'#f59e0b'}}>⚠ No lead open — output will be generic.</div>}
              {lead&&<div style={{display:'flex',gap:10,padding:'10px 12px',borderRadius:9,background:'var(--p-soft)',border:'1px solid rgba(91,63,200,0.2)'}}>
                <div style={{flex:1}}><div style={{fontSize:11,fontWeight:700,color:'var(--p-glow)',marginBottom:4}}>Intelligence loaded for this lead:</div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'2px 16px'}}>
                    {[['Intent',lead.intent],['AI Score',lead.aiScore],['Reviews',lead.reviews],['AI Visibility',`${lead.aiVisibility||0}%`],['Competitor',lead.intelligence?.competitors?.[0]||lead.competitor||'—'],['Stage',lead.stage]].map(([k,v])=>(
                      <div key={k} style={{display:'flex',gap:4}}><span style={{fontSize:10,color:T2}}>{k}:</span><span style={{fontSize:10,color:T1,fontWeight:500}}>{v}</span></div>
                    ))}
                  </div>
                </div>
              </div>}
              <div style={{border:`1px solid ${B1}`,borderRadius:9,overflow:'hidden'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 12px',background:dark?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.03)',borderBottom:`1px solid ${B1}`}}>
                  <span style={{fontSize:10,fontWeight:600,color:T2,textTransform:'uppercase',letterSpacing:'0.05em'}}>Prompt Preview</span>
                  <button onClick={copyPrompt} style={{display:'flex',alignItems:'center',gap:4,padding:'3px 8px',borderRadius:5,border:`1px solid ${B1}`,background:'transparent',color:copied?'#10b981':'var(--p-glow)',fontSize:10,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>
                    <Ico name={copied?'checkCircle':'copy'} size={10}/>{copied?'Copied!':'Copy Prompt'}
                  </button>
                </div>
                <div style={{padding:'10px 12px',maxHeight:120,overflow:'auto'}}>
                  <pre style={{fontSize:10,color:T2,lineHeight:1.6,whiteSpace:'pre-wrap',fontFamily:'JetBrains Mono,monospace',margin:0}}>{prompt.slice(0,600)}…</pre>
                </div>
              </div>
              <div>
                <div style={{fontSize:11,fontWeight:600,color:T2,marginBottom:5}}>Paste AI response here (if using copy-paste flow):</div>
                <textarea value={output} onChange={e=>setOutput(e.target.value)} rows={6} placeholder="Copy prompt → paste in Claude.ai → copy response → paste here…" style={{width:'100%',padding:'10px 12px',borderRadius:9,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:12,fontFamily:'inherit',lineHeight:1.7,resize:'vertical',outline:'none'}} onFocus={e=>e.target.style.borderColor='var(--p)'} onBlur={e=>e.target.style.borderColor=B1}/>
              </div>
              {error&&<div style={{padding:'8px 12px',borderRadius:8,background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.2)',fontSize:12,color:'#f87171'}}>⚠ {error}</div>}
            </div>
          )}
          {step===2&&(
            <div style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:12}}>
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',borderRadius:8,background:'rgba(16,185,129,0.08)',border:'1px solid rgba(16,185,129,0.2)'}}>
                <Ico name="checkCircle" size={13} color="#10b981"/><span style={{fontSize:12,color:'#10b981',fontWeight:500}}>Generated — review and edit before saving</span>
              </div>
              <textarea value={output} onChange={e=>setOutput(e.target.value)} rows={14} style={{width:'100%',padding:'12px',borderRadius:9,border:`1px solid ${B1}`,background:BG,color:T1,fontSize:12,fontFamily:'inherit',lineHeight:1.8,resize:'vertical',outline:'none'}} onFocus={e=>e.target.style.borderColor='var(--p)'} onBlur={e=>e.target.style.borderColor=B1}/>
            </div>
          )}
        </div>
        {/* Footer */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 20px',borderTop:`1px solid ${B1}`,flexShrink:0,background:dark?'rgba(0,0,0,0.2)':'rgba(0,0,0,0.02)'}}>
          <button onClick={()=>{if(step>0)setStep(s=>s-1);else closeCopilot();}} style={{padding:'7px 14px',borderRadius:8,border:`1px solid ${B1}`,background:'transparent',color:T2,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>{step===0?'Cancel':'← Back'}</button>
          <div style={{display:'flex',gap:8}}>
            {step===1&&<>
              {hasKey&&<button onClick={generateDirect} disabled={generating} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 16px',borderRadius:8,border:'none',background:generating?'rgba(59,130,246,0.3)':'#3b82f6',color:'#fff',fontSize:12,fontWeight:600,cursor:generating?'not-allowed':'pointer',fontFamily:'inherit'}}>
                {generating?<><Spinner size={12}/> Generating…</>:<><Ico name="sparkles" size={12}/>Generate Directly</>}
              </button>}
              {!hasKey&&<button onClick={()=>{navigator.clipboard.writeText(prompt);window.open('https://claude.ai','_blank');}} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',borderRadius:8,border:`1px solid ${B1}`,background:'transparent',color:T1,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}><Ico name="externalLink" size={12}/>Open Claude.ai</button>}
              {output&&<button onClick={()=>setStep(2)} style={{display:'flex',alignItems:'center',gap:6,padding:'7px 16px',borderRadius:8,border:'none',background:'var(--p)',color:'#fff',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>Review & Save <Ico name="chevRight" size={13}/></button>}
            </>}
            {step===2&&<button onClick={saveOutput} style={{display:'flex',alignItems:'center',gap:5,padding:'7px 16px',borderRadius:8,border:'none',background:saved?'#10b981':'var(--p)',color:'#fff',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',transition:'background 0.2s'}}>
              {saved?<><Ico name="checkCircle" size={13}/> Saved!</>:<><Ico name="save" size={13}/> Save to Activity Log</>}
            </button>}
          </div>
        </div>
      </div>
    </>
  );
}

      <TopBar sw={sw}/>
      <main style={{marginLeft:sw,paddingTop:56,transition:'margin-left 0.2s ease'}}>
        <div style={{padding:fullWidth?'18px 14px':'24px 22px',maxWidth:fullWidth?'100%':1260,margin:'0 auto'}}>
          {activeLead ? <LeadPage/> : <ViewComp/>}
        </div>
      </main>
      <CopilotModal/>
    </div>
  );
}

function App() {
  return <AppProvider><AppShell/></AppProvider>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App/></React.StrictMode>);

</script>
</body>
</html>
